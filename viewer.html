<style>
/* Layout: tek sütunlu defter; üstte sekme + çağ filtresi, altında açılır kayıtlar */
:root{
  --bg:#EEF1EE; --surface:#FAFBFA; --ink:#16211F; --muted:#56635F; --line:#CCD5D0;
  --crimson:#9B1B30; --petrol:#1F5C5A; --ochre:#7A5C0C; --chip:#E2E8E4;
  --display:"Marcellus",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#18221F; --ink:#E6ECE8; --muted:#9AA8A2; --line:#2D3A36;
  --crimson:#E8798A; --petrol:#6FC2BD; --ochre:#D9B54A; --chip:#24302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#18221F; --ink:#E6ECE8; --muted:#9AA8A2; --line:#2D3A36;
  --crimson:#E8798A; --petrol:#6FC2BD; --ochre:#D9B54A; --chip:#24302C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:400 clamp(28px,5vw,40px)/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button{font-size:15px;padding:9px 16px}
.era-h{font:400 22px/1.2 var(--display);margin:18px 0 0;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.era-h small{font:500 12px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.04em}
.list{display:flex;flex-direction:column}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:12px 2px}
summary::-webkit-details-marker{display:none}
.yr{font:500 13px var(--mono);color:var(--crimson);font-variant-numeric:tabular-nums;white-space:nowrap}
.ttl{font-weight:700;min-width:0}
.ttl span{display:block;font-weight:400;color:var(--muted);font-size:14px}
.key{font:500 13px var(--mono);border:1px solid var(--petrol);color:var(--petrol);border-radius:3px;padding:1px 7px}
details[open]>summary{border-bottom:1px dashed var(--line)}
.body{padding:14px 2px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.body p{margin:0;max-width:68ch}
ul,ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.tag{font:500 11px var(--mono);border-radius:3px;padding:1px 6px;background:var(--chip);color:var(--ink);margin-right:6px;white-space:nowrap}
.alt{color:var(--ochre);border:1px solid var(--ochre);background:transparent}
.hist{color:var(--petrol);border:1px solid var(--petrol);background:transparent}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt b{font-weight:600}
.reply{color:var(--muted);font-style:italic}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx span{font:500 12px var(--mono);background:var(--chip);border-radius:3px;padding:2px 7px;font-variant-numeric:tabular-nums}
.speech{font:400 19px/1.45 var(--display);border-left:3px solid var(--crimson);padding-left:14px;max-width:60ch}
.speech+.speech{font:16px/1.55 var(--body)}
.note{color:var(--muted);font-size:14px}
.warn{border:1px solid var(--ochre);border-radius:4px;padding:10px 14px;font-size:14px}
.warn ul{max-width:none}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
dt{color:var(--muted);font-size:14px} dd{margin:0;min-width:0}
a{color:var(--petrol)}
@media (max-width:520px){summary{grid-template-columns:1fr auto}.yr{grid-column:1/-1}dl{grid-template-columns:1fr}}
</style>

urces": [{"Title": "TDV İslâm Ansiklopedisi, “Asâkir-i Mansûre-i Muhammediyye”", "Url": "https://islamansiklopedisi.org.tr/asakir-i-mansure-i-muhammediyye"}], "AccuracyNotes": ["Fes, Mansûre ordusunun başlığı olarak 1827–1829’da benimsendi; 1826 sahnelerinde askerler fesli gösterilmemeli.", "İlk buharlı geminin adı ve alım yılı (genellikle “Sürat”, 1820’lerin sonu) kaynakla teyit edilmeli."]}, {"Name": "C10_ZeytinburnuVeKirim", "Era": "Era2", "Title": "Zeytinburnu’nun Ocakları, Kırım’ın Telleri", "StartYear": 1843, "EndYear": 1856, "Locations": ["Zeytinburnu Demir Fabrikası", "Tophane-i Âmire", "İstanbul–Edirne–Şumnu telgraf hattı", "Tuna hattı: Silistre, Kalafat", "Sinop", "Kars", "Kırım: Gözleve, Sivastopol"], "HistoricalContext": "1840’larda Zeytinburnu–Bakırköy sahilinde devlet eliyle demir, dökümhane ve dokuma tesisleri kuruldu; yönetim, usta ve makine bakımından dışa bağımlılık süreklilik sorunu yarattı. Ekim 1853’te başlayan Kırım Harbi’nde Ömer Lütfi Paşa Tuna’da başarılar kazandı; 30 Kasım 1853’te Sinop’ta bir Osmanlı filosu yok edildi; 1854’te Silistre savunuldu, 1855’te Kars uzun kuşatmadan sonra düştü. Savaş sırasında telgraf Osmanlı ülkesine girdi (İstanbul–Edirne–Şumnu hattı 1855) ve 1854’te ilk dış borç alındı. Savaş 1856 Paris Antlaşması’yla bitti.", "PlayerRole": "Tophane müşirliği levazım reisi: fabrikayı, telgrafı ve cephe ikmalini eşgüdümler.", "Steps": [{"Id": "s1", "Layer": "AOE", "Text": "Zeytinburnu’nda dökümhane, haddehane ve iskele inşa et; kömür ve cevher yolunu bağla."}, {"Id": "s2", "Layer": "HOI4", "Text": "Tuna ve Kafkas cephelerine erzak/mühimmat yönlendir; Sinop baskını sonrası Karadeniz ikmalini yeniden kur."}, {"Id": "s3", "Layer": "TPS", "Text": "Tuna karargâhında Ömer Lütfi Paşa ile telgraf hattı ve ikmal önceliğini görüş."}, {"Id": "s4", "Layer": "HOI4", "Text": "Müttefik komuta ve dış borç seçeneklerini dengele."}], "PrimaryObjectives": ["Cepheye zamanında mühimmat ulaştır", "Telgraf hattını faal tut", "Fabrikanın bakım/üretim kapasitesini sürdürülebilir kıl"], "HistoricalOutcome": "Osmanlı Devleti, İngiltere, Fransa ve Sardunya ile ittifak içinde savaşı kazanan tarafta yer aldı; Paris Antlaşması Karadeniz’i tarafsızlaştırdı. Dış borçlanma dönemi başladı.", "WhatIf": "Yerli üretim verimi artırılabilir; fakat tek bir fabrika kısa sürede bütün modern silah ihtiyacını karşılayamaz. “Zeytinburnu & Tophane Ağır Sanayi Hamlesi” odak dalının ön koşulu bu görevdir.", "Events": [{"Id": "sinop_raid", "Trigger": "Kasım 1853", "Text": "TELGRAF YOK, ULAK VAR: Sinop limanındaki filo yandı."}, {"Id": "first_foreign_loan", "Trigger": "Treasury < 20", "Text": "Londra sarrafları istikraz teklif ediyor."}, {"Id": "telegraph_line_open", "Trigger": "Yıl 1855", "Text": "Şumnu’dan İstanbul’a ilk tel çekildi."}, {"Id": "kars_siege", "Trigger": "Yıl 1855", "Text": "Kars garnizonu açlık çekiyor; yardım kuvveti gecikti."}], "Outcomes": [{"Id": "line_security", "Label": "Hat güvenliği", "IsHistorical": true, "Effects": [{"Stat": "Supply", "Value": 12}, {"Stat": "PP", "Value": 20}]}, {"Id": "factory_investment", "Label": "Fabrika yatırımı", "IsHistorical": false, "Effects": [{"Stat": "Treasury", "Value": -45}, {"Stat": "FactoryEfficiency", "Value": 12}]}, {"Id": "foreign_purchase", "Label": "Dış alım ve istikraz", "IsHistorical": true, "Effects": [{"Stat": "Eq_Infantry", "Value": 500}, {"Stat": "Treasury", "Value": -60}, {"Stat": "Debt", "Value": 20}]}], "NPCs": ["NPC11_OmerLutfiPasa"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Hazîne-i Hâssa”", "Url": "https://islamansiklopedisi.org.tr/hazine-i-hassa"}, {"Title": "TDV İslâm Ansiklopedisi, “Tanzimat”", "Url": "https://islamansiklopedisi.org.tr/tanzimat"}, {"Title": "TDV İslâm Ansiklopedisi, “Kırım Savaşı” maddesi", "Url": ""}], "AccuracyNotes": ["Zeytinburnu tesisleri “silah fabrikası” olarak kurulmadı; demir/döküm tesisidir. Bina adı oyunda “Zeytinburnu Demir Fabrikası” olmalı; silah üretimi yükseltme olarak açılabilir.", "Kırım cephesinde demiryolunu (Balaklava hattı) İngilizler döşedi; Osmanlı demiryolu değildir."]}, {"Name": "C11_ZirhliDonanma", "Era": "Era3", "Title": "Zırhlı Donanma, Ağır Borç", "StartYear": 1861, "EndYear": 1876, "Locations": ["Haliç – Tersane-i Âmire", "Dolmabahçe önü demir yeri", "Londra ve Fransa tezgâhları (sipariş ekranı)"], "HistoricalContext": "Sultan Abdülaziz döneminde donanmaya büyük yatırım yapıldı; İngiliz ve Fransız tezgâhlarına zırhlılar ısmarlandı, bir kısmı Tersane-i Âmire’de inşa edildi. Saltanatın sonunda Osmanlı donanması zırhlı gemi sayısı bakımından dünyanın önde gelen filoları arasındaydı. Ancak yetişmiş mürettebat, bakım ve kömür giderleri karşılanamadı; Ekim 1875’te devlet borç faizlerini ödeyemeyeceğini ilan etti. İngiliz bahriyeli Hobart Paşa 1860’ların sonundan itibaren Osmanlı donanmasında görev yaptı.", "PlayerRole": "Bahriye Nezareti erkânı: sipariş, tersane ve bütçe arasında denge kurar.", "Steps": [{"Id": "s1", "Layer": "HOI4", "Text": "Zırhlı siparişlerini seç: yurtdışı tezgâh mı, Haliç’te inşa mı?"}, {"Id": "s2", "Layer": "AOE", "Text": "Tersane’de kuru havuz, kazan atölyesi ve kömür deposu inşa et."}, {"Id": "s3", "Layer": "TPS", "Text": "Tersane rıhtımında Hobart Paşa ile mürettebat talimini ve filo hazırlığını görüş."}, {"Id": "s4", "Layer": "HOI4", "Text": "1875: bütçe heyetine bakım ve borç yükünü raporla."}], "PrimaryObjectives": ["Hazır gemi oranını yükselt", "Makine ve topçu mürettebatını eğit", "Bütçeyi çökertmeden filoyu faal tut"], "HistoricalOutcome": "Büyük bir zırhlı filosu kuruldu; malî kriz ve bakım sorunları sürdürülebilirliği baltaladı. II. Abdülhamid döneminde filo büyük ölçüde Haliç’te atıl kaldı.", "WhatIf": "Daha küçük fakat bakımlı filo seçeneği, sayı yerine hazır olma oranına odaklanır ve borcu sınırlar.", "Events": [{"Id": "mesudiye_launch", "Trigger": "Yıl 1874", "Text": "Londra’dan haber: Mesudiye zırhlısı denize indirildi."}, {"Id": "default_1875", "Trigger": "Debt > 60", "Text": "Hazine faiz ödemelerini yarıya indiriyor."}], "Outcomes": [{"Id": "big_fleet", "Label": "Büyük filo (tarihsel)", "IsHistorical": true, "Effects": [{"Stat": "Eq_Naval", "Value": 4}, {"Stat": "Debt", "Value": 35}, {"Stat": "Stability", "Value": -6}, {"Stat": "NavalReadiness", "Value": -5}]}, {"Id": "maintained_fleet", "Label": "Küçük, bakımlı filo", "IsHistorical": false, "Effects": [{"Stat": "Eq_Naval", "Value": 2}, {"Stat": "NavalReadiness", "Value": 15}, {"Stat": "Treasury", "Value": -35}]}], "NPCs": ["NPC12_HobartPasa"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Abdülaziz”", "Url": "https://islamansiklopedisi.org.tr/abdulaziz"}], "AccuracyNotes": ["“Dünyanın üçüncü büyük donanması” ifadesi yaygındır ama ölçüte göre değişir; oyun metninde “önde gelen filolardan” denmeli."]}, {"Name": "C12_PlevneVeAziziye", "Era": "Era3", "Title": "Tuna’da Düğüm: Plevne ve Aziziye", "StartYear": 1877, "EndYear": 1878, "Locations": ["Plevne tabyaları", "Şıpka Geçidi", "Erzurum – Aziziye ve Mecidiye tabyaları", "Gedikler / Alacadağ"], "HistoricalContext": "Nisan 1877’de başlayan 93 Harbi’nde Gazi Osman Paşa, Temmuz’dan itibaren Plevne’yi savundu; Temmuz ve Eylül 1877’deki üç büyük Rus-Romen taarruzunu püskürttü. Tam kuşatma ve açlık üzerine 10 Aralık 1877’de yarma harekâtını denedi, yaralandı ve teslim oldu. Doğuda Ahmed Muhtar Paşa, Gedikler ve Yahniler’deki başarılarıyla “Gazi” unvanını aldı; Alacadağ yenilgisinden sonra Erzurum’a çekildi. Kasım 1877’de Aziziye tabyalarına yapılan gece baskını, Erzurum halkının da katıldığı karşı hücumla geri atıldı; Nene Hatun bu direnişin simgesidir. Savaş Ayastefanos ve Berlin (1878) antlaşmalarıyla ağır kayıplarla bitti.", "PlayerRole": "Plevne’de bir fırka kumandanı; ikinci harita kolunda Erzurum müdafaasında erkân-ı harp.", "Steps": [{"Id": "s1", "Layer": "AOE", "Text": "Plevne çevresinde toprak tabyaları ve siperleri inşa et; üç taarruzu karşıla."}, {"Id": "s2", "Layer": "HOI4", "Text": "Orhaniye–Plevne ikmal kolunu açık tut; erzakı bölük bazında paylaştır."}, {"Id": "s3", "Layer": "TPS", "Text": "Plevne karargâhında Gazi Osman Paşa ile yarma/savunma kararını görüş."}, {"Id": "s4", "Layer": "AOE", "Text": "Erzurum kolu: Aziziye tabyasına gece baskınını şehir halkıyla birlikte geri at."}, {"Id": "s5", "Layer": "TPS", "Text": "Erzurum’da Gazi Ahmed Muhtar Paşa ve Aziziye’de Nene Hatun ile konuş."}], "PrimaryObjectives": ["Savunma birliklerini gereksiz kayıptan koru", "Sivil halk için tahliye/iaşe düzeni kur", "Haberleşmeyi açık tut"], "HistoricalOutcome": "Plevne düştü; Rus ordusu Edirne’ye ve Ayastefanos’a kadar ilerledi. Erzurum savaş boyunca hücumla alınamadı, mütareke şartlarıyla boşaltıldı. Berlin Antlaşması’yla Kars, Ardahan ve Batum Rusya’ya bırakıldı.", "WhatIf": "“Plevne İkmal Hattı” ALTERNATİF TARİHTİR: 1877’de Plevne’ye ulaşan bir demiryolu yoktu. Görev, böyle bir hattın savaştan önce döşenmiş olduğu varsayımına dayanır ve yalnızca ilgili odak tamamlanmışsa açılır.", "Events": [{"Id": "third_assault", "Trigger": "Eylül 1877", "Text": "Büyük taarruz: Grivitsa tabyası elden çıktı, diğerleri tutuluyor."}, {"Id": "plevne_starvation", "Trigger": "Supply < 15", "Text": "Tayın yarıya indirildi; yaralılar için ilaç kalmadı."}, {"Id": "aziziye_night_raid", "Trigger": "Kasım 1877", "Text": "Minarelerden sela veriliyor: “Moskof Aziziye’ye girdi!”"}], "Outcomes": [{"Id": "historical_breakout", "Label": "Aralık yarma teşebbüsü (tarihsel)", "IsHistorical": true, "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "Manpower", "Value": -1200}, {"Stat": "Organization", "Value": -10}]}, {"Id": "early_withdrawal", "Label": "Çember kapanmadan çekil", "IsHistorical": false, "Effects": [{"Stat": "Manpower", "Value": -300}, {"Stat": "WarSupport", "Value": -6}, {"Stat": "Organization", "Value": 6}]}, {"Id": "rail_supply_whatif", "Label": "Demiryolu ikmali (what-if)", "IsHistorical": false, "Effects": [{"Stat": "Supply", "Value": 20}, {"Stat": "Manpower", "Value": -250}, {"Stat": "SabotageRisk", "Value": 15}]}], "NPCs": ["NPC13_GaziOsmanPasa", "NPC14_GaziAhmedMuhtarPasa", "NPC15_NeneHatun"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Doksanüç Harbi”", "Url": "https://islamansiklopedisi.org.tr/doksanuc-harbi"}, {"Title": "TDV İslâm Ansiklopedisi, “Erzurum”", "Url": "https://islamansiklopedisi.org.tr/erzurum"}], "AccuracyNotes": ["Plevne’de Osmanlı piyadesi Peabody-Martini ve Winchester tüfekleri kullandı; Mavzer bu görevde yer almamalı.", "Aziziye baskınının günü kaynaklarda 8/9 Kasım 1877 olarak geçer; teyit edilmeli."]}, {"Name": "C13_MavzerVeKrupp", "Era": "Era3", "Title": "Goltz Paşa’nın Talimi, Mavzer’in Namlusu", "StartYear": 1883, "EndYear": 1895, "Locations": ["Mekteb-i Harbiye (Pangaltı)", "Tophane-i Âmire", "Maçka Silahhanesi", "Oberndorf ve Essen (sipariş ekranı)"], "HistoricalContext": "93 Harbi yenilgisinden sonra II. Abdülhamid Alman askerî heyetinden yararlandı. Colmar von der Goltz 1883–1895 arasında Osmanlı hizmetinde bulundu; Mekteb-i Harbiye’nin ders programını ve erkân-ı harbiye eğitimini düzenledi, ordunun redif ve seferberlik teşkilatına dair layihalar hazırladı. Aynı dönemde Mauser fabrikasına büyük tüfek siparişleri verildi (1887 modeli, ardından 7,65 mm’lik 1890 ve 1893 modelleri); Krupp’tan sahra ve kale topları alındı. Bu alımlar orduyu modernleştirirken dışa bağımlılığı ve borcu artırdı.", "PlayerRole": "Tophane ve Teçhizat-ı Askeriye komisyonu üyesi: tecrübe atışlarını, siparişi ve eğitimi yürütür.", "Steps": [{"Id": "s1", "Layer": "TPS", "Text": "Mekteb-i Harbiye’de Goltz Paşa ile ders programını ve harp oyununu görüş."}, {"Id": "s2", "Layer": "AOE", "Text": "Atış sahasında Mavzer ve rakip tüfeklerin, Krupp sahra topunun tecrübesini yap."}, {"Id": "s3", "Layer": "HOI4", "Text": "Sipariş miktarını, ödeme takvimini ve fişek imalinin İstanbul’da yapılıp yapılmayacağını kararlaştır."}, {"Id": "s4", "Layer": "AOE", "Text": "Yeni tüfekle donatılmış Nizamiye taburunu manevrada sına."}], "PrimaryObjectives": ["Subay eğitim seviyesini yükselt", "Piyadeyi tek tip mekanizmalı tüfeğe geçir", "Fişek v t hattı için tasarılar hazırladı. İstanbul 1888’de Avrupa ağına bağlandı; Sirkeci Garı 1890’da açıldı. Anadolu Demiryolu Haydarpaşa’dan 1892’de Ankara’ya ulaştı. Hicaz Demiryolu’nun yapımına 1900’de başlandı; başmühendis Heinrich August Meissner’di, işçiliğin büyük kısmını Osmanlı askerleri yaptı, masrafın önemli bölümü Müslümanların bağışlarıyla karşılandı. Hat 1908’de Medine’ye ulaştı.", "PlayerRole": "Nafia Nezareti demiryolu komiseri: güzergâh, finansman ve askerî-sivil kullanım dengesini kurar.", "Steps": [{"Id": "s1", "Layer": "HOI4", "Text": "Güzergâh ve finansman modelini seç: imtiyazlı şirket mi, devlet/bağış mı?"}, {"Id": "s2", "Layer": "TPS", "Text": "Sirkeci plan odasında Wilhelm von Pressel ile ağ tasarısını görüş."}, {"Id": "s3", "Layer": "AOE", "Text": "Şam’dan güneye ray, köprü, su deposu ve istasyon inşa et; amele taburlarını yönet."}, {"Id": "s4", "Layer": "TPS", "Text": "Hat başında Meissner Paşa ile su ve bakım sorununu çöz; Medine’ye ilk treni karşıla."}], "PrimaryObjectives": ["Hattı güvenli ve işler biçimde tamamla", "Her 25 km’de su/onarım noktası kur", "Hac ve askerî sevkiyat arasında kapasite dengesi kur"], "HistoricalOutcome": "Hicaz hattı Şam’dan Medine’ye ulaştı; Mekke’ye uzatılamadı. Bağdat hattı I. Dünya Savaşı’na kadar tamamlanamadı.", "WhatIf": "Hattın Mekke ve Cidde’ye uzatılması alternatif hedeftir: yerel muhalefet ve deve kervanı ekonomisiyle çatışma doğurur.", "Events": [{"Id": "donation_campaign", "Trigger": "Yıl 1900", "Text": "Hindistan’dan Fas’a iane defterleri açıldı."}, {"Id": "water_shortage", "Trigger": "Step s3", "Text": "Maan’dan sonra kuyu yok; lokomotif suyu vagonla taşınıyor."}, {"Id": "medina_arrival", "Trigger": "Yıl 1908", "Text": "İlk tren Medine istasyonuna girdi."}], "Outcomes": [{"Id": "donation_network", "Label": "Bağış ağı", "IsHistorical": true, "Effects": [{"Stat": "Treasury", "Value": 35}, {"Stat": "PP", "Value": 15}]}, {"Id": "military_priority", "Label": "Askerî öncelik", "IsHistorical": false, "Effects": [{"Stat": "Supply", "Value": 15}, {"Stat": "Stability", "Value": -5}]}, {"Id": "pilgrim_priority", "Label": "Hac önceliği", "IsHistorical": true, "Effects": [{"Stat": "Stability", "Value": 8}, {"Stat": "MilitaryCapacity", "Value": -5}]}], "NPCs": ["NPC17_WilhelmVonPressel", "NPC18_MeissnerPasa"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Hicaz Demiryolu”", "Url": "https://islamansiklopedisi.org.tr/hicaz-demiryolu"}], "AccuracyNotes": ["Meissner Paşa yalnız Hicaz (ve sonra Bağdat) hattıyla ilişkilendirilmeli; Şark Demiryolları’nın mühendisi değildir.", "Bugünkü Haydarpaşa Garı binası 1908–1909’da tamamlandı; daha önceki yıllarda eski, küçük istasyon binası modellenmeli."]}, {"Name": "C15_DomekedenMeclise", "Era": "Era3", "Title": "Dömeke’den Meclise", "StartYear": 1897, "EndYear": 1908, "Locations": ["Alasonya", "Milona Geçidi", "Yenişehir (Larissa)", "Dömeke", "Resne, Manastır, Selanik", "İstanbul"], "HistoricalContext": "Girit meselesi yüzünden çıkan 1897 Osmanlı-Yunan Savaşı Nisan–Mayıs aylarında bir ay kadar sürdü. Müşir Edhem Paşa komutasındaki ordu Milona’yı geçti, Yenişehir ve Velestin’den sonra 17 Mayıs’ta Dömeke’de kesin başarı kazandı. Büyük devletlerin araya girmesiyle mütareke yapıldı; barışta Osmanlı Devleti savaş tazminatı ve küçük sınır düzeltmeleriyle yetindi, Girit ise özerk statüye geçti. Temmuz 1908’de Makedonya’daki subay hareketi (Resne, Manastır) üzerine II. Abdülhamid Kanun-ı Esasi’yi yeniden yürürlüğe koydu.", "PlayerRole": "1897’de fırka kumandanı; 1908’de Üçüncü Ordu’da bir erkân-ı harp zabiti.", "Steps": [{"Id": "s1", "Layer": "HOI4", "Text": "Tesalya sınırında seferberliği demiryoluyla (Selanik hattı) tamamla."}, {"Id": "s2", "Layer": "AOE", "Text": "Milona Geçidi’ni aç; Dömeke sırtlarına topçu destekli taarruz et."}, {"Id": "s3", "Layer": "TPS", "Text": "Karargâhta Edhem Paşa ile ileri harekât / mütareke kararını görüş."}, {"Id": "s4", "Layer": "HOI4", "Text": "1908: Manastır ve Selanik’ten gelen telgraflar karşısında birlikleri karakteri olarak yer alabilir, komuta rolü abartılmamalı."]}, {"Name": "C17_Trablusgarp", "Era": "Era4", "Title": "Trablusgarp: Çölde Fedailer", "StartYear": 1911, "EndYear": 1912, "Locations": ["Trablus", "Bingazi", "Derne", "Tobruk", "Mısır sınırı – Sellum"], "HistoricalContext": "İtalya 29 Eylül 1911’de savaş ilan ederek Trablusgarp ve Bingazi kıyılarına asker çıkardı. Bölgedeki Osmanlı garnizonu zayıftı; Mısır İngiliz denetiminde, deniz İtalyan donanmasının elindeydi. Enver Bey, Mustafa Kemal, Fethi Bey gibi subaylar kılık değiştirerek Mısır ve Tunus üzerinden bölgeye geçti ve Senûsîlerle birlikte yerel direnişi örgütledi. Savaşta uçak ilk kez keşif ve bombardıman için kullanıldı. İtalya’nın On İki Ada’yı işgali ve Balkan Harbi’nin patlaması üzerine 18 Ekim 1912’de Uşi Antlaşması imzalandı.", "PlayerRole": "Gizlice bölgeye geçen bir kurmay subay: kabile kuvvetlerini ve garnizon artıklarını örgütler.", "Steps": [{"Id": "s1", "Layer": "HOI4", "Text": "Mısır ve Tunus üzerinden gizli subay, para ve cephane sevk et."}, {"Id": "s2", "Layer": "AOE", "Text": "Derne ve Tobruk önünde çadır karargâhı, eğitim ordugâhı ve seyyar hastane kur."}, {"Id": "s3", "Layer": "AOE", "Text": "İtalyan kıyı mevzilerine gece baskınları düzenle; donanma topu menzilinden uzak dur."}, {"Id": "s4", "Layer": "HOI4", "Text": "Ekim 1912: Balkan seferberliği başladı; subayları geri çağır ya da çölde bırak."}], "PrimaryObjectives": ["Yerel direnişin ikmalini sürdür", "İtalyanları kıyı şeridinde tut", "Balkan cephesine stratejik yedek ayır"], "HistoricalOutcome": "Uşi Antlaşması’yla Trablusgarp ve Bingazi İtalya’ya bırakıldı; On İki Ada “geçici” kaydıyla İtalyan işgalinde kaldı. Yerel direniş sonraki yıllarda sürdü.", "WhatIf": "Daha uzun direniş İtalya’nın maliyetini yükseltir; deniz ablukasını kendiliğinden kırmaz ve Balkan cephesini zayıflatır.", "Events": [{"Id": "first_air_raid", "Trigger": "Kasım 1911", "Text": "Bir İtalyan tayyaresi ordugâha el bombası attı; neferler göğe ateş ediyor."}, {"Id": "dodecanese_occupied", "Trigger": "Mayıs 1912", "Text": "Rodos’a İtalyan askeri çıktı."}, {"Id": "balkan_ultimatum", "Trigger": "Ekim 1912", "Text": "Karadağ harp ilan etti."}], "Outcomes": [{"Id": "covert_supply", "Label": "Gizli ikmali sürdür", "IsHistorical": true, "Effects": [{"Stat": "WarSupport", "Value": 5}, {"Stat": "Eq_Infantry", "Value": 180}, {"Stat": "Treasury", "Value": -25}]}, {"Id": "withdraw", "Label": "Kuvvetleri çek, Uşi’yi imzala", "IsHistorical": true, "Effects": [{"Stat": "Manpower", "Value": 500}, {"Stat": "Stability", "Value": -8}, {"Stat": "PP", "Value": -20}]}], "NPCs": [], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Osmanlılar”", "Url": "https://islamansiklopedisi.org.tr/osmanlilar"}, {"Title": "TDV İslâm Ansiklopedisi, “Trablusgarp Savaşı” maddesi", "Url": ""}], "AccuracyNotes": ["İlk hava bombardımanının tarihi (1 Kasım 1911) ve pilotun adı teyit edilerek olay kartına eklenebilir."]}, {"Name": "C18_CatalcaVeEdirne", "Era": "Era4", "Title": "Çatalca Hattı, Edirne ve Hamidiye", "StartYear": 1912, "EndYear": 1913, "Locations": ["Kırkkilise, Lüleburgaz", "Çatalca tahkimat hattı", "Hadımköy karargâhı", "Edirne kalesi", "Ege, Adriyatik ve Doğu Akdeniz (Hamidiye rotası)"], "HistoricalContext": "Ekim 1912’de başlayan Birinci Balkan Harbi’nde Osmanlı orduları Kırkkilise ve Lüleburgaz’da yenilerek Çatalca hattına çekildi; ordu kolera salgınıyla kırıldı, İstanbul muhacirle doldu. Kasım 1912’de Bulgar taarruzu Çatalca’da durduruldu. Ocak 1913’te Babıâli Baskını’yla hükûmet devrildi; Şükrü Paşa’nın savunduğu Edirne Mart 1913’te açlıktan teslim oldu. Rauf Bey komutasındaki Hamidiye kruvazörü 1913 boyunca Ege, Adriyatik ve Akdeniz’de ticaret ve nakliye gemilerine akınlar yaptı. Balkan devletleri birbirine düşünce Osmanlı kuvvetleri Temmuz 1913’te Edirne’yi geri aldı.", "PlayerRole": "Çatalca’da kolordu erkân-ı harbi; deniz kolunda Hamidiye’nin ikmal planlayıcısı.", "Steps": [{"Id": "s1", "Layer": "AOE", "Text": "Çatalca’da tabya, tel örgü ve sahra bataryaları kur; Bulgar taarruzunu karşıla."}, {"Id": "s2", "Layer": "HOI4", "Text": "Kolera karantinasını, su dağıtımını ve muhacir iskânını yönet."}, {"Id": "s3", "Layer": "TPS", "Text": "Hamidiye güvertesinde Rauf Bey ile akın rotasını ve kömür ikmalini kararlaştır."}, {"Id": "s4", "Layer": "HOI4", "Text": "Temmuz 1913: Edirne’ye ilerleyişin diplomatik ve askerî şartlarını değerlendir."}], "PrimaryObjectives": ["İstanbul’un savunmasını tut", "Salgın kaybını sınırla", "Edirne harekâtında ikmal ve kuvvet bütünlüğünü koru"], "HistoricalOutcome": "Çatalca hattı tutuldu; Rumeli’nin büyük kısmı kaybedildi; Edirne 1913’te geri alındı. Hamidiye akınları moral kaynağı oldu fakat Ege’de deniz hâkimiyeti sağlamadı.", "WhatIf": "Seferberliğin terhis edilmeden tamamlanması Kırkkilise–Lüleburgaz hattında tutunma şansı verir; mutlak zafer vaat etmez.", "Events": [{"Id": "cholera_outbreak", "Trigger": "Kasım 1912", "Text": "Hadımköy’de kolera: günde yüzlerce nefer hastalanıyor."}, {"Id": "babiali_raid", "Trigger": "Ocak 1913", "Text": "Babıâli basıldı; Harbiye Nazırı vuruldu."}, {"Id": "edirne_falls", "Trigger": "Mart 1913", "Text": "Edirne’den son telsiz: “Erzak bitti.”"}], "Outcomes": [{"Id": "hold_catalca", "Label": "Çatalca’yı tut", "IsHistorical": true, "Effects": [{"Stat": "Stability", "Value": 8}, {"Stat": "Manpower", "Value": -300}]}, {"Id": "retake_edirne", "Label": "Edirne’ye yürü", "IsHistorical": true, "Effects": [{"Stat": "WarSupport", "Value": 10}, {"Stat": "Supply", "Value": -12}, {"Stat": "ForeignPressure", "Value": 8}]}, {"Id": "hamidiye_raids", "Label": "Hamidiye akınları", "IsHistorical": true, "Effects": [{"Stat": "NavalReadiness", "Value": -8}, {"Stat": "ConvoyDisruption", "Value": 12}, {"Stat": "WarSupport", "Value": 4}]}], "NPCs": ["NPC21_RaufBey"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Mehmed V”", "Url": "https://islamansiklopedisi.org.tr/mehmed-v"}, {"Title": "TDV İslâm Ansiklopedisi, “Balkan Savaşı” maddesi", "Url": ""}], "AccuracyNotes": ["Bu gelişmeler tek, kesintisiz bir zafer anlatısına dönüştürülmemeli; görev ağır bir yenilginin içindeki tutunma hikâyesidir."]}, {"Name": "C19_Canakkale", "Era": "Era4", "Title": "Çanakkale: Boğaz Geçilmez", "StartYear": 1914, "EndYear": 1916, "Locations": ["Çanakkale Müstahkem Mevkii", "Rumeli Mecidiye ve Hamidiye tabyaları", "Erenköy Koyu", "Seddülbahir", "Arıburnu", "Conkbayırı – Anafartalar"], "HistoricalContext": "Ağustos 1914’te İngiltere, parası ödenmiş Sultan Osman-ı Evvel ve Reşadiye dretnotlarına el koydu; aynı ay Goeben ve Breslau Boğaz’dan geçerek Yavuz ve Midilli adını aldı. Aralık 1914’te eski Mesudiye zırhlısı bir İngiliz denizaltısınca batırıldı. Mart 1915 başında Nusret mayın gemisi Erenköy Koyu’na gizlice bir mayın hattı döktü. 18 Mart 1915’te Boğaz’ı zorlayan İtilaf filosu, Müstahkem Mevki Kumandanı Cevat Paşa’nın bataryaları ve mayınlar karşısında üç zırhlı kaybederek çekildi. 25 Nisan’da başlayan kara muharebeleri Seddülbahir, Arıburnu ve Ağustos’ta Anafartalar’da sürdü; İtilaf kuvvetleri Ocak 1916’da yarımadayı boşalttı. İki taraf da çok ağır kayıp verdi.", "PlayerRole": "Müstahkem Mevki erkân-ı harbi; kara safhasında bir alay kumandanı.", "Steps": [{"Id": "s1", "Layer": "AOE", "Text": "Tabyaları onar, seyyar obüs bataryalarını gizle, mayın hatlarını ve ışıldakları yerleştir."}, {"Id": "s2", "Layer": "TPS", "Text": "Kilitbahir’de Cevat Paşa ile cephane tasarrufunu ve Nusret’in mayın görevini görüş."}, {"Id": "s3", "Layer": "AOE", "Text": "18 Mart: filo taarruzunu karşıla; cephaneyi son safhaya sakla."}, {"Id": "s4", "Layer": "AOE", "Text": "25 Nisan ve sonrası: Seddülbahir ve Arıburnu’nda siper muharebesi; su, sıhhiye ve ihtiyat yönetimi."}, {"Id": "s5", "Layer": "HOI4", "Text": "5. Ordu ihtiyat fırkalarını Bolayır, Saros ve Anadolu yakası arasında paylaştır; İstanbul’dan deniz ve kara ikmalini denizaltı tehdidine karşı düzenle."}], "PrimaryObjectives": ["Boğaz’ı kapalı tut", "Ağır top cephanesini tüketme", "Kara cephesinde hastalık ve susuzluk kaybını azalt"], "HistoricalOutcome": "İtilaf donanması Boğaz’ı geçemedi; kara harekâtı da sonuç alamadı ve yarımada boşaltıldı.", "WhatIf": "“Sultan Osman-ı Evvel ve Reşadiye Teslimatı” dalı alternatif tarihtir. İki dretnot bile İngiliz Akdeniz filosuna ve Rus Karadeniz filosuna karşı otomatik “mutlak hâkimiyet” vermez; kömür, mürettebat ve havuz sınırlamaları oyun kuralı olarak kalır.", "Events": [{"Id": "dreadnoughts_seized", "Trigger": "Ağustos 1914", "Text": "Londra’dan telgraf: gemilere el kondu."}, {"Id": "nusret_minefield", "Trigger": "Mart 1915", "Text": "Nusret gece karanlığında Erenköy’e mayın döktü."}, {"Id": "march_18", "Trigger": "18 Mart 1915", "Text": "Bouvet alabora oldu!"}, {"Id": "landings", "Trigger": "25 Nisan 1915", "Text": "Seddülbahir ve Arıburnu’na çıkarma başladı."}], "Outcomes": [{"Id": "fortify", "Label": "Tahkimat ve mayın", "IsHistorical": true, "Effects": [{"Stat": "FortLevel", "Value": 2}, {"Stat": "Eq_Artillery", "Value": -250}]}, {"Id": "strait_held", "Label": "Boğaz tutulur", "IsHistorical": true, "Effects": [{"Stat": "WarSupport", "Value": 15}, {"Stat": "Manpower", "Value": -2500}, {"Stat": "Stability", "Value": 5}]}], "NPCs": ["NPC22_CevatPasa"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Çanakkale Muharebeleri” maddesi", "Url": ""}, {"Title": "TDV İslâm Ansiklopedisi, “Osmanlılar”", "Url": "https://islamansiklopedisi.org.tr/osmanlilar"}], "AccuracyNotes": ["Nusret’in mayın dökme gecesi (7/8 Mart 1915), mayın sayısı ve gemi/mayın subaylarının adları Deniz Kuvvetleri yayınlarından teyit edilmeli.", "Seyit Onbaşı sahnesi kullanılacaksa mermi ağırlığı ve isabet anlatısı kaynakla doğrulanmalı."]}, {"Name": "C20_UzakCepheler", "Era": "Era4", "Title": "Uzak Cepheler: Kut, Medine, Kafkasya", "StartYear": 1914, "EndYear": 1919, "Locations": ["Sarıkamış", "Erzurum", "Selman-ı Pâk", "Kut’ül-Amâre", "Medine", "Bakü"], "HistoricalContext": "Kafkas cephesi Aralık 1914–Ocak 1915’te Sarıkamış harekâtının soğuk, hastalık ve çarpışmadan gelen ağır kayıplarıyla açıldı; 1916’da Erzurum, Trabzon ve Erzincan Rusların eline geçti, 1917 ihtilalinden sonra geri alındı; Eylül 1918’de Nuri Paşa komutasındaki Kafkas İslâm Ordusu Bakü’ye girdi. Irak’ta General Townshend’in tümeni Selman-ı Pâk’tan sonra Kut’a çekildi ve Aralık 1915’ten itibaren kuşatıldı; kurtarma kuvvetleri püskürtüldü, garnizon 29 Nisan 1916’da Halil Paşa’ya teslim oldu. Hicaz’da 1916 isyanından sonra Fahreddin Paşa, demiryolu sürekli tahrip edilirken Medine’yi savundu; Mondros’tan sonra da teslimi reddetti, şehir Ocak 1919’da teslim edildi.", "PlayerRole": "Harbiye Nezareti menzil müfettişi: üç cepheyi ayrı harekât olarak besler.", "Steps": [{"Id": "s1", "Layer": "HOI4", "Text": "Kafkasya: kışlık giyim, erzak ve geri çekilme hattını planla (Sarıkamış kararı)."}, {"Id": "s2", "Layer": "TPS", "Text": "Kut önünde Halil Paşa ile kuşatma ve teslim şartlarını görüş."}, {"Id": "s3", "Layer": "AOE", "Text": "Hicaz hattında istasyon blokhavzları ve onarım treni kur; Medine’yi iaşe et."}, {"Id": "s4", "Layer": "TPS", "Text": "Medine istasyonunda Fahreddin Paşa ile teslim emrini; Kafkas kolunda Nuri Paşa ile Bakü yürüyüşünü görüş."}], "PrimaryObjectives": ["Her cepheyi ayrı ikmal bütçesiyle yönet", "Soğuk ve hastalık kaybını azalt", "Siyasî ve askerî emirler arasındaki çelişkiyi çöz"], "HistoricalOutcome": "Kut bir Osmanlı zaferidir; Bağdat ise Mart 1917’de düştü. Medine savunması Ocak 1919’da sona erdi. Kafkas cephesi ağır insan kaybı ve Mondros’la gelen geri çekilmeyle kapandı.", "WhatIf": "Sarıkamış taarruzunu bahara ertelemek veya iptal etmek alternatif karardır; 3. Ordu’yu korur, fakat “Turan” savaş hedeflerinden vazgeçmek PP’ye mal olur.", "Events": [{"Id": "sarikamis_blizzard", "Trigger": "Aralık 1914", "Text": "Allahuekber Dağları’nda tipi: kollar birbirini kaybetti."}, {"Id": "kut_surrender", "Trigger": "Nisan 1916", "Text": "Townshend teslim şartlarını soruyor."}, {"Id": "hejaz_rail_cut", "Trigger": "1917", "Text": "Hat yine havaya uçuruldu; onarım treni yola çıktı."}, {"Id": "mudros_order", "Trigger": "Kasım 1918", "Text": "İstanbul’dan emir: Medine teslim edilecek."}], "Outcomes": [{"Id": "kut_supply", "Label": "Kut kuşatmasını besle", "IsHistorical": true, "Effects": [{"Stat": "Supply", "Value": 10}, {"Stat": "Manpower", "Value": -180}, {"Stat": "WarSupport", "Value": 8}]}, {"Id": "medina_evacuate", "Label": "Medine’yi erken tahliye et", "IsHistorical": false, "Effects": [{"Stat": "PP", "Value": -20}, {"Stat": "Manpower", "Value": 250}, {"Stat": "Supply", "Value": 6}]}, {"Id": "medina_resist", "Label": "Medine’de diren (tarihsel)", "IsHistorical": true, "Effects": [{"Stat": "WarSupport", "Value": 5}, {"Stat": "Supply", "Value": -15}]}, {"Id": "sarikamis_postponed", "Label": "Kış taarruzunu ertele", "IsHistorical": false, "Effects": [{"Stat": "Manpower", "Value": 1500}, {"Stat": "PP", "Value": -40}, {"Stat": "WarSupport", "Value": -5}]}], "NPCs": ["NPC23_HalilPasa", "NPC24_FahreddinPasa", "NPC25_NuriPasa"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Fahreddin Paşa”", "Url": "https://islamansiklopedisi.org.tr/fahreddin-pasa"}, {"Title": "TDV İslâm Ansiklopedisi, “Kûtülamâre”, “Sarıkamış Harekâtı” maddeleri", "Url": ""}], "AccuracyNotes": ["Sarıkamış kayıp sayıları kaynaklara göre çok değişir; oyun metninde kesin rakam verilmemeli.", "Bu cephelerin geçtiği coğrafyada 1915’te Ermeni tehciri ve kitlesel sivil ölümler yaşandı; içerik bu konuyu yok saymamalı veya oyunlaştırmamalı, tarih danışmanı ve yayıncı politikasıyla ele alınmalıdır.", "Kut esirlerinin yürüyüşte verdiği ağır kayıp “düzenli teslim” seçeneğinin neden oyun kararı olduğunu açıklar."]}, {"Name": "C21_ImalatiHarbiye", "Era": "Era4", "Title": "İmalat-ı Harbiye ve İstiklal Yolu", "StartYear": 1919, "EndYear": 1923, "Locations": ["İstanbul: Tophane, Zeytinburnu, Maçka Silahhanesi, Karaağaç", "Akbaş cephaneliği (Gelibolu)", "İnebolu iskelesi", "Kastamonu – Çankırı – Ankara kağnı yolu", "Ankara: İmalat-ı Harbiye atölyeleri"], "HistoricalContext": "Mondros Mütarekesi’nden sonra İstanbul’daki silah ve cephane depoları İtilaf denetimine girdi. Gizli gruplar (başta Karakol Cemiyeti ve sonraki teşkilatlar), askerî fabrika ustaları, depo memurları, kayıkçılar ve hamallar silah, kama, fişek ve tezgâh parçalarını Anadolu’ya kaçırdı. Ocak 1920’de Gelibolu yarımadasındaki Akbaş cephaneliği basılarak silahlar karşı yakaya geçirildi. Karadeniz’den İnebolu’ya çıkarılan malzeme kağnılarla Kastamonu üzerinden Ankara’ya taşındı; bu yük büyük ölçüde köylü kadınların omzundaydı. Ankara ve çevresinde kurulan atölyeler tüfek onardı, süngü ve fişek imal etti. Savaş Ekim 1922’de Mudanya Mütarekesi ve Temmuz 1923’te Lozan Antlaşması’yla sona erdi.", "PlayerRole": "İstanbul’da gizli sevkiyat grubunda bir levazım subayı; sonra Ankara’da imalat şubesi müdür muavini.", "Steps": [{"Id": "s1", "Layer": "TPS", "Text": "İşgal altındaki İstanbul’da gece: Tophane atölyesinde ustabaşıyla buluş, devriyelere görünmeden depoyu say."}, {"Id": "s2", "Layer": "HOI4", "Text": "Sevkiyat rotalarını aç: İnebolu deniz yolu, İzmit/Kocaeli kara yolu, Akbaş baskını."}, {"Id": "s3", "Layer": "AOE", "Text": "İnebolu–Ankara hattında menzil noktaları, kağnı kolları ve Ankara’da tamir atölyesi kur."}, {"Id": "s4", "Layer": "HOI4", "Text": "Sakarya ve Büyük Taarruz öncesi sevkiyat partilerini cephe ihtiyacına göre böl."}], "PrimaryObjectives": ["Sevkiyatın yakalanma riskini düşük tut", "Usta ve işçileri Anadolu’ya geçir", "Silahları cepheye çalışır halde ulaştır"], "HistoricalOutcome": "İstanbul’dan kaçırılan malzeme ve Anadolu’daki onarım/imalat faaliyeti, Sovyet yardımı ve ele geçirilen silahlarla birlikte ordunun donatımını sağladı. Ankara’daki atölyeler Cumhuriyet’in askerî fabrikalarının çekirdeği oldu.", "WhatIf": "Tezgâhların büyük kısmının erken kaçırılması Ankara’da üretimi hızlandırır; fakat keşif riskini ve İstanbul’daki misillemeyi artırır. 1923–1925 dönemi ayrı bir epilog (Cumhuriyet’in ilanı, askerî fabrikaların teşkili) olarak tasarlanmalıdır.", "Events": [{"Id": "akbas_raid", "Trigger": "Ocak 1920", "Text": "Akbaş’tan haber: cephanelik boşaltıldı, kayıklar karşıya geçti."}, {"Id": "depot_inspection", "Trigger": "DiscoveryRisk > 40", "Text": "İtilaf kontrol subayı depoyu sayıma geliyor."}, {"Id": "inebolu_shelled", "Trigger": "1921", "Text": "İnebolu iskelesi denizden topa tutuldu; kayıkçılar sandıkları sırtlarında taşıdı."}, {"Id": "ox_cart_winter", "Trigger": "Kış", "Text": "Ilgaz’da kar: kağnı kolu geçitte kaldı."}], "Outcomes": [{"Id": "covert_shipments", "Label": "Gizli sevkiyat", "IsHistorical": true, "Effects": [{"Stat": "Eq_Infantry", "Value": 220}, {"Stat": "PP", "Value": 25}, {"Stat": "DiscoveryRisk", "Value": 15}]}, {"Id": "anatolian_workshops", "Label": "Anadolu’da atölye", "IsHistorical": true, "Effects": [{"Stat": "FactoryEfficiency", "Value": 10}, {"Stat": "Eq_Infantry", "Value": 100}, {"Stat": "Eq_Artillery", "Value": 20}]}, {"Id": "evacuate_workers", "Label": "Ustaları geçir", "IsHistorical": true, "Effects": [{"Stat": "Manpower", "Value": 80}, {"Stat": "Output", "Value": -5}, {"Stat": "DiscoveryRisk", "Value": -10}]}], "NPCs": ["NPC26_ImalatiHarbiyeUstabasi"], "Sources": [{"Title": "TDV İslâm Ansiklopedisi, “Millî Mücadele” ve “Karakol Cemiyeti” maddeleri", "Url": ""}, {"Title": "Genelkurmay ATASE yayınları: Türk İstiklal Harbi serisi (İdarî Faaliyetler cildi)", "Url": ""}], "AccuracyNotes": ["Bu görevin tarihsel çerçevesi ATASE ve MKE kurum tarihleriyle genişletilmelidir; atölye adları, müdürleri ve üretim miktarları bu dosyada bilinçli olarak verilmemiştir.", "Nuri Killigil’in silah fabrikacılığı Cumhuriyet dönemine aittir; bu görevde İmalat-ı Harbiye çalışanı olarak gösterilmemeli."]}], "np": [{"Name": "NPC01_BaltaciMehmedPasa", "FullName": "Baltacı Mehmed Paşa", "Title": "Sadrazam ve Serdar-ı Ekrem", "Era": "Era1", "Chapters": ["C01_Prut"], "ActiveFrom": 1711, "ActiveTo": 1711, "InteractKey": "F", "Location": "Prut ordugâhı – Otağ-ı Hümâyun yanındaki divan çadırı, harita masası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Kallâvî (vezir kavuğu), sade sorguç", "Clothing": "Samur kürklü vezir kaftanı, sefer çizmesi, belinde hançer", "FacialHair": "Kırlaşmış kısa sakal", "Props": ["Sefer defteri", "Mühr-i hümâyun kesesi", "Prut krokisi"], "Forbidden": ["Fes", "Apolet", "Nişan/madalya", "Dürbünlü modern harita aletleri"], "ArtRefNote": "Güvenilir çağdaş portresi yoktur; 18. yy başı vezir tasvirleri (Levnî minyatürleri, Vanmour tabloları) esas alınmalı."}, "Personality": "Saraydan yetişme, temkinli, askerin halini gözeten; ihtirastan çok ihtiyat.", "Greeting": "Buyurun serdar. Moskof tabur içinde sıkışmıştır; lâkin bizim askerin de karnı, cephane sandığı kadar mühimdir.", "Prompt": "Çar’ın murahhası sulh diler. Yeniçeri üç gündür hücumdan yorgun, zahire dardır. Şartları bugün mü bağlayalım, yoksa kuşatmanın yükünü göze alıp yarını mı bekleyelim?", "Choices": [{"Id": "A", "Text": "Azak’ı ve hudut kalelerini şarta bağlayıp sulhu akdedelim.", "Reply": "İsabet. Elde olanı sağlama bağlamak, olmayanın ardına düşmekten evlâdır.", "IsAlternate": false, "Unlocks": "C01_Prut.treaty", "Effects": [{"Stat": "PP", "Value": 50}, {"Stat": "Stability", "Value": 4}, {"Stat": "WarSupport", "Value": -3}]}, {"Id": "B", "Text": "Çemberi daraltalım; Çar teslim olmadan sulh olmaz.", "Reply": "Öyle ise mesuliyet ikimizin boynunadır. Zahire kollarını bizzat siz çekip çevireceksiniz.", "IsAlternate": true, "Unlocks": "C01_Prut.continue_siege", "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "Supply", "Value": -12}, {"Stat": "Manpower", "Value": -250}]}, {"Id": "C", "Text": "İsveç kralının adamını ve Kırım Hanı’nı da dinleyip öyle karar verelim.", "Reply": "Dinleyelim; ancak her geçen gün Moskof’a nefes, bize masraftır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "PP", "Value": -20}, {"Stat": "Stability", "Value": 2}, {"Stat": "DelayDays", "Value": 14}, {"Stat": "BreakoutChance", "Value": 10}]}], "HistoricalNote": "Antlaşmadan sonra XII. Karl ve Kırım Hanı Devlet Giray’ın şikâyetleriyle azledildi; 1712’de Limni’de öldü."}, {"Name": "NPC02_IbrahimMuteferrika", "FullName": "İbrahim Müteferrika", "Title": "Dergâh-ı Âlî müteferrikası, matbaa kurucusu", "Era": "Era1", "Chapters": ["C02_LaleDevri"], "ActiveFrom": 1727, "ActiveTo": 1745, "InteractKey": "E", "Location": "Sultanselim semtindeki evinin alt katı – Dârü’t-tıbâati’l-âmire, baskı tezgâhı başı", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Orta boy sarık (kalem ehli)", "Clothing": "Koyu çuha cübbe, mürekkep lekeli iş önlüğü, kolları sıvalı", "FacialHair": "Kır sakal", "Props": ["Ahşap baskı tezgâhı", "Dizgi kasası ve kurşun harfler", "Harita levhaları", "Islak formalar"], "Forbidden": ["Askerî kıyafet", "Avrupaî kıyafet"], "ArtRefNote": "Çağdaş portresi bilinmiyor; yaygın temsilî resimler sonradan yapılmıştır."}, "Personality": "Macar asıllı, çok dilli, sabırlı bir zanaatkâr-âlim; devlete nizam fikrini kitapla anlatır.", "Greeting": "Hoş geldiniz efendim. Dikkat buyurun, şu forma henüz yaştır.", "Prompt": "Lügat cildi tezgâhtadır; lâkin Leh ve Venedik kâğıdı pahalı gelir, hattat esnafı da rızkından endişelidir. Basmayı sürdürmem için ya kâğıt, ya himaye, ya da vakit lâzım.", "Choices": [{"Id": "A", "Text": "Hazineden kâğıt bedeli tahsis edelim; lügat ve tarih kitapları çıksın.", "Reply": "Allah devlete zeval vermesin. Bin cilt, bin hattatın yıllarca yazacağını bir mevsimde verir.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -15}, {"Stat": "ResearchSpeed", "Value": 6}]}, {"Id": "B", "Text": "Evvela harita ve askerlik fenni basın; ordunun işine yarasın.", "Reply": "Nizam-ı asker bahsinde bir risale kaleme almaktayım; haritalarla beraber takdim ederim.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -10}, {"Stat": "Organization", "Value": 3}, {"Stat": "ResearchSpeed", "Value": 3}]}, {"Id": "C", "Text": "Yalova’da kâğıt imalathanesi kuralım; dışarıya muhtaç olmayalım.", "Reply": "Uzun iştir, usta ister, su ister; ama doğrusu budur.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -30}, {"Stat": "FactoryEfficiency", "Value": 4}, {"Stat": "DelayDays", "Value": 90}]}], "HistoricalNote": "1729–1742 arasında 17 eser bastı; “Usûlü’l-hikem fî nizâmi’l-ümem” adlı ıslahat risalesinin yazarıdır. Yalova kâğıt imalathanesi 1740’larda kurulmuştur."}, {"Name": "NPC03_DamatIbrahimPasa", "FullName": "Nevşehirli Damat İbrahim Paşa", "Title": "Sadrazam", "Era": "Era1", "Chapters": ["C02_LaleDevri"], "ActiveFrom": 1718, "ActiveTo": 1730, "InteractKey": "F", "Location": "Sâdâbâd Kasrı önü, Kâğıthane deresi kenarı; 1730’da Topkapı Sarayı arz odası önü", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Kallâvî, mücevherli sorguç", "Clothing": "Çiçek desenli ağır kemha kaftan, samur kürk", "FacialHair": "Gür, bakımlı kır sakal", "Props": ["Lale soğanı defteri", "Sefaretname nüshası", "Mühür"], "Forbidden": ["Fes", "Askerî üniforma"], "ArtRefNote": "Jean-Baptiste Vanmour’un dönem tabloları ve Levnî’nin Surnâme minyatürleri."}, "Personality": "Sulhperver, zarif, uzlaşmacı; sıkıntıyı şenlikle örtmeye meyilli.", "Greeting": "Gel bakalım. Paris’ten gelen sefaretnameyi okudun mu? Frengin bahçesini de, kışlasını da yazmış.", "Prompt": "Acem serhaddinden fena haberler gelir, çarşıda ekmek pahalanır. Şehrin nabzı yükseliyor. Ne dersin, nereden başlayalım?", "Choices": [{"Id": "A", "Text": "Yeni vergileri kaldıralım, esnafın arzuhalini divanda okuyalım.", "Reply": "Hazine sızlanır ama halkın duası alınır. Yazdır fermanı.", "IsAlternate": true, "Unlocks": "C02_LaleDevri.hear_petitions", "Effects": [{"Stat": "Stability", "Value": 8}, {"Stat": "Treasury", "Value": -20}]}, {"Id": "B", "Text": "Padişah ordunun başında Üsküdar’dan sefere çıksın; söylentiler kesilsin.", "Reply": "Ordu Üsküdar’da bekledikçe söz çoğalır. Çıkacaksak çıkalım.", "IsAlternate": true, "Unlocks": "", "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "Treasury", "Value": -25}, {"Stat": "Stability", "Value": 3}]}, {"Id": "C", "Text": "Kâğıthane’de şenlik tertip edelim; şehir oyalansın.", "Reply": "Halk eğlenceyi sever… Yahut biz öyle zannederiz.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "PP", "Value": 15}, {"Stat": "Treasury", "Value": -15}, {"Stat": "Stability", "Value": -6}]}], "HistoricalNote": "Patrona Halil İsyanı’nda isyancıların talebi üzerine 1 Ekim 1730’da idam edildi."}, {"Name": "NPC04_HumbaraciAhmedPasa", "FullName": "Humbaracı Ahmed Paşa (Claude Alexandre, Comte de Bonneval)", "Title": "Humbaracıbaşı, beylerbeyi", "Era": "Era1", "Chapters": ["C03_Humbarahane"], "ActiveFrom": 1731, "ActiveTo": 1747, "InteractKey": "E", "Location": "Üsküdar Humbarahanesi – Hendesehâne talim avlusu, havan topu başı", "IsHistoricalPerson": true, "Appearance": {"Headwear": "İri beyaz sarık", "Clothing": "Kürk yakalı Osmanlı paşa kaftanı; duruşu ve jestleri Avrupalı subay", "FacialHair": "Uzun beyaz sakal", "Props": ["Pergel ve gönye", "Havan topu kesit çizimi", "Humbara (demir bomba) kalıbı"], "Forbidden": ["Avrupa üniforması (Osmanlı hizmetinde)", "Fes"], "ArtRefNote": "Sarıklı ve sakallı çağdaş portreleri (18. yy gravür ve pastelleri) mevcuttur; doğrudan referans alınabilir."}, "Personality": "Mağrur, nüktedan, tecrübeli asker; Fransa ve Avusturya’da generallik yapmış bir maceraperest.", "Greeting": "Yaklaşın efendim, yaklaşın. Havan ısırmaz; hesabı yanlış yapılırsa ısırır.", "Prompt": "Bir humbara yalnız barutla değil, hendeseyle hedef bulur. Mektebin kapısını açarsanız, toprağa gömdüğünüz akçeyi yetişmiş nefer ve mühendis olarak geri alırsınız. Ocak ağaları ise mırıldanır.", "Choices": [{"Id": "A", "Text": "Hendese dersleri ve maaşlı talim hemen başlasın.", "Reply": "Âlâ! Üç yüz nefer verin, bir senede size üç yüz usta teslim edeyim.", "IsAlternate": false, "Unlocks": "C03_Humbarahane.steady_budget", "Effects": [{"Stat": "Treasury", "Value": -25}, {"Stat": "Eq_Artillery", "Value": 120}, {"Stat": "Organization", "Value": 5}]}, {"Id": "B", "Text": "Önce dökümhaneyi düzeltelim; mektep sonra.", "Reply": "İyi top lâzım, doğru. Fakat onu nişanlayacak göz yetişmezse pahalı bir çan dökmüş oluruz.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -15}, {"Stat": "FactoryEfficiency", "Value": 8}]}, {"Id": "C", "Text": "Ocakların itirazı yatışana dek bekleyelim.", "Reply": "Ben Viyana’da da, Versay’da da beklemeyi öğrenemedim. Burada da öğreneceğimi sanmam.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Stability", "Value": 4}, {"Stat": "PP", "Value": 5}, {"Stat": "DelayDays", "Value": 60}]}], "HistoricalNote": "1747’de İstanbul’da öldü; kabri Galata Mevlevîhânesi hazîresindedir."}, {"Name": "NPC05_KocaRagipPasa", "FullName": "Koca Ragıp Mehmed Paşa", "Title": "Sadrazam", "Era": "Era1", "Chapters": ["C04_RagipPasaSulhu"], "ActiveFrom": 1757, "ActiveTo": 1763, "InteractKey": "F", "Location": "Babıâli – sadaret dairesi, divan odası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Kallâvî", "Clothing": "Sade ama kıymetli kürklü kaftan", "FacialHair": "Uzun beyaz sakal", "Props": ["Divit ve kalemdan", "Ferman tomarları", "Divan (şiir) mecmuası", "Kitap rahlesi"], "Forbidden": ["Fes", "Askerî üniforma"], "ArtRefNote": "Yaşlı âlim-vezir tipi; kütüphanesindeki kitabeler ve dönem vezir tasvirleri."}, "Personality": "Şair, diplomat, soğukkanlı; sözü mısra gibi tartar.", "Greeting": "Otur evlâdım. Acele işe şeytan karışır; devlet işine ise düşman.", "Prompt": "Frengistan yedi yıldır birbirini yer. Prusya kralı ittifak ister, Nemçe elçisi dostluk yemini eder. Devletin kuvveti yalnız meydanda değil, hazinenin hesabında ve sulhun vaktinde de ölçülür.", "Choices": [{"Id": "A", "Text": "Sulhu koruyalım, hazineyi dolduralım.", "Reply": "Top döktürmek kolaydır; onu besleyecek barutu ve neferi bulmak müşküldür. Evvela kese.", "IsAlternate": false, "Unlocks": "C04_RagipPasaSulhu.peace_and_treasury", "Effects": [{"Stat": "Treasury", "Value": 20}, {"Stat": "Stability", "Value": 5}, {"Stat": "WarSupport", "Value": -2}]}, {"Id": "B", "Text": "Sulh sürerken topçuyu ve kaleleri ıslah edelim.", "Reply": "Barışta kılıç bilemek… Ocak hoşlanmaz, hazine sızlanır. Lâkin haksız değilsin.", "IsAlternate": true, "Unlocks": "C04_RagipPasaSulhu.peace_and_reform", "Effects": [{"Stat": "Treasury", "Value": -30}, {"Stat": "Eq_Artillery", "Value": 160}, {"Stat": "Organization", "Value": 3}]}, {"Id": "C", "Text": "Taşra gelirlerini derhal merkeze aktaralım.", "Reply": "Âyanın kesesine uzanan el, ısırılmayı da göze almalıdır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": 35}, {"Stat": "PP", "Value": 10}, {"Stat": "Stability", "Value": -8}]}], "HistoricalNote": "Divan sahibi şairdir; birçok mısraı darbımesel olmuştur. Buradaki sözler alıntı değil, üsluba uygun özgün metindir."}, {"Name": "NPC06_CezayirliGaziHasanPasa", "FullName": "Cezayirli Gazi Hasan Paşa", "Title": "Kaptan-ı Derya", "Era": "Era1", "Chapters": ["C05_CesmeVeLimni"], "ActiveFrom": 1770, "ActiveTo": 1789, "InteractKey": "G", "Location": "Haliç – Tersane-i Âmire rıhtımı, kızakta bir kalyonun önü; Kalyoncu Kışlası avlusu", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Büyük beyaz sarık", "Clothing": "Kırmızı çuha kaptan paşa kaftanı, altın sırma kuşak, belinde pala", "FacialHair": "Gür, pos bıyık ve kır sakal; güneş yanığı yüz", "Props": ["Kalyon maketi", "Dürbün (tek gözlü pirinç)", "Deniz haritası (portolan)"], "Forbidden": ["Fes", "Apoletli deniz üniforması"], "ArtRefNote": "18. yy sonuna ait gravürleri vardır. Yanında aslan bulunan tasvirler rivayete dayanır; kullanılacaksa isteğe bağlı kozmetik olarak işaretlenmeli."}, "Personality": "Sert, gözü pek, tayfasına düşkün; Cezayir ocağından yetişme denizci.", "Greeting": "Bre hoş geldin! Denizci misin, kalem efendisi mi? Elini göster, anlarım.", "Prompt": "Çeşme’de gemi değil, usta levend kaybettik. Kalyoncu kışın evine dağılır, baharda yarısı dönmez. Bana kışla, kereste ve akçe ver; sana donanma vereyim.", "Choices": [{"Id": "A", "Text": "Kalyoncu Kışlası yapılsın; tayfa yıl boyu maaşlı kalsın.", "Reply": "Hah! İşte şimdi donanma oldu. Gemiyi kereste değil, tayfa yüzdürür.", "IsAlternate": false, "Unlocks": "C05_CesmeVeLimni.limni_relieved", "Effects": [{"Stat": "Treasury", "Value": -30}, {"Stat": "NavalReadiness", "Value": 12}, {"Stat": "Organization", "Value": 5}]}, {"Id": "B", "Text": "Tezgâhlara yeni kalyonlar koyalım; sayı lâzım.", "Reply": "Olur. Ama içine koyacak adamı da sen bulacaksın.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -40}, {"Stat": "Eq_Naval", "Value": 3}, {"Stat": "NavalReadiness", "Value": -4}]}, {"Id": "C", "Text": "Tersane’de hendese ve seyir dersi açalım.", "Reply": "Ben yıldıza bakıp yol bulurum; gençler kâğıda baksın. Zararı yok, açılsın.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -15}, {"Stat": "ResearchSpeed", "Value": 5}, {"Stat": "NavalReadiness", "Value": 4}]}], "HistoricalNote": "Kasımpaşa’daki Kalyoncu Kışlası’nı yaptırdı. 1790’da sadrazam ve serdar-ı ekrem iken Şumnu’da öldü."}, {"Name": "NPC07_BaronDeTott", "FullName": "François Baron de Tott", "Title": "Fransız topçu subayı, Osmanlı hizmetinde askerî uzman", "Era": "Era1", "Chapters": ["C06_SuratTopculari"], "ActiveFrom": 1770, "ActiveTo": 1776, "InteractKey": "E", "Location": "Çanakkale – Kilitbahir tabyası siperi; İstanbul’da Hasköy dökümhanesi atış sahası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Üç köşeli şapka (tricorne), pudralı peruk", "Clothing": "18. yy Fransız subay ceketi (justaucorps), yelek, diz altı pantolon, binici çizmesi", "FacialHair": "Tıraşlı", "Props": ["Kadran (topçu açıölçeri)", "Tabya planı", "Sahra topu kundak maketi"], "Forbidden": ["Sarık", "Kaftan", "Fes"], "ArtRefNote": "Hatıratının (Mémoires, 1784–85) baskılarındaki gravürler."}, "Personality": "Çalışkan, kendini beğenmiş, sabırsız; Türkçe bilir.", "Greeting": "Ah, nihayet! Bana tercüman değil, karar verecek biri lâzımdı.", "Prompt": "Boğazın müdafaası topun büyüklüğünden evvel mevziin ve nişanın hesabına bağlıdır. Şu mermer gülle atan koca toplar heybetlidir, ama saatte bir atar. Bana hafif top, seri atan nefer verin.", "Choices": [{"Id": "A", "Text": "Sürat topçusu ocağını kuralım.", "Reply": "Dakikada üç atım! Göreceksiniz, Rus bunu bizden beklemez.", "IsAlternate": false, "Unlocks": "C06_SuratTopculari.trained_gunners", "Effects": [{"Stat": "Organization", "Value": 10}, {"Stat": "Treasury", "Value": -18}]}, {"Id": "B", "Text": "Önce Boğaz’a yeni tabya ve cephanelik.", "Reply": "Makul. Çapraz ateş veren iki batarya, yüz gülleden iyidir.", "IsAlternate": false, "Unlocks": "C06_SuratTopculari.forts", "Effects": [{"Stat": "FortLevel", "Value": 1}, {"Stat": "Eq_Artillery", "Value": -100}]}, {"Id": "C", "Text": "Tersane’de duba ve nakliye işine eğilelim.", "Reply": "Köprü kurmayı bilmeyen ordu nehirde boğulur. Peki, çizimleri getireyim.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Supply", "Value": 8}, {"Stat": "Treasury", "Value": -12}]}], "HistoricalNote": "1776’da Fransa’ya döndü. Hatıratı Osmanlıları küçümseyen ve kendi payını büyüten bir dille yazılmıştır."}, {"Name": "NPC08_SelimIII", "FullName": "Sultan III. Selim", "Title": "Padişah", "Era": "Era2", "Chapters": ["C07_NizamiCedid"], "ActiveFrom": 1789, "ActiveTo": 1807, "InteractKey": "F", "Location": "Levent Çiftliği talim meydanı kenarındaki kasır; Topkapı Sarayı’nda çalışma odası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Selimî kavuk, elmas sorguç", "Clothing": "Kürklü kırmızı kapaniçe, altında sade entari", "FacialHair": "Siyah, dolgun sakal", "Props": ["Ney ve tambur (bestekârdır)", "Nizam-ı Cedid kanunnamesi", "Talim planı"], "Forbidden": ["Fes", "Avrupaî üniforma", "Nişan"], "ArtRefNote": "Konstantin Kapıdağlı’nın 1803 tarihli portresi (Topkapı Sarayı Müzesi)."}, "Personality": "Hassas, sanatkâr, ıslahata inanmış; kan dökmekten çekinen.", "Greeting": "Gel. Şu neferlerin yürüyüşüne bak; adımları bir, tüfekleri bir.", "Prompt": "Yeni nizam yalnız tüfeğin ve talimin tecdidi değildir; onu ayakta tutacak hazine ve itimat da lâzımdır. Ocak homurdanır, âyan gücenir, ulema ikiye bölünür. Birliğini hazırla; fakat payitahtın nabzını da dinle.", "Choices": [{"Id": "A", "Text": "İrad-ı Cedid’i ve talimi ne pahasına olursa olsun koruyalım.", "Reply": "Bu yol dardır, biliyorum. Yürümeye mecburuz.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -30}, {"Stat": "Organization", "Value": 12}, {"Stat": "Stability", "Value": -3}]}, {"Id": "B", "Text": "Ocak ağaları ve ulema ile bir meşveret meclisi toplayalım.", "Reply": "Söz ile olacaksa kan ile olmasın. Topla.", "IsAlternate": false, "Unlocks": "C07_NizamiCedid.political_compromise", "Effects": [{"Stat": "PP", "Value": -25}, {"Stat": "Stability", "Value": 8}, {"Stat": "Organization", "Value": -3}]}, {"Id": "C", "Text": "Yeni taburları payitahtta hazır tutalım; isyan çıkarsa kullanalım.", "Reply": "Kendi kulum üzerine asker sürmek… Buna gönlüm razı değildir; ama tedbiri elden bırakma.", "IsAlternate": true, "Unlocks": "C07_NizamiCedid.use_force", "Effects": [{"Stat": "Manpower", "Value": -200}, {"Stat": "Stability", "Value": 4}, {"Stat": "Organization", "Value": 4}]}], "HistoricalNote": "“İlhâmî” mahlasıyla şiir yazan ve Sûzidilârâ makamını terkip eden bestekârdır. 28 Temmuz 1808’de öldürüldü."}, {"Name": "NPC09_AlemdarMustafaPasa", "FullName": "Alemdar Mustafa Paşa", "Title": "Rusçuk âyanı, Sadrazam", "Era": "Era2", "Chapters": ["C08_Alemdar"], "ActiveFrom": 1808, "ActiveTo": 1808, "InteractKey": "R", "Location": "Babıâli avlusu – Sekban-ı Cedid neferlerinin yoklama yeri", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Sarık (Rumeli usulü, kalın sargı)", "Clothing": "Kürklü vezir kaftanı altında Rumeli âyanı cepkeni, silahlık, çift piştov, yatağan", "FacialHair": "Pala bıyık, kısa sakal", "Props": ["Sadaret mührü", "Sened-i İttifak sureti", "Çakmaklı tüfek"], "Forbidden": ["Fes", "Avrupaî üniforma"], "ArtRefNote": "Güvenilir portresi yoktur; Rumeli âyanı kıyafetleri için 19. yy başı seyyah gravürleri."}, "Personality": "Yeniçerilikten gelme, kaba saba, cesur ve sadık; siyaset inceliğinden uzak.", "Greeting": "Lafı uzatma kardaş. İstanbul’un lafı çok, adamı az.", "Prompt": "Payitahtta bir emrin kıymeti, onu tutacak kuvvet kadardır. Yeni askeri kurarız; lâkin Rumeli’den getirdiğim yiğitler memleketine dönmek ister, yeniçeri de diş biler. Kışlanın kapısını ve halkın rızasını birlikte gözetmezsek ateş Babıâli’ye sıçrar.", "Choices": [{"Id": "A", "Text": "Sekban-ı Cedid’i kuralım, maaşını sağlama bağlayalım.", "Reply": "Tamam. Adını değiştirdik, işi değişmedi: talimli asker.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -25}, {"Stat": "Organization", "Value": 10}, {"Stat": "Manpower", "Value": 600}]}, {"Id": "B", "Text": "Rumeli kuvvetlerini terhis etmeyin; kış boyu İstanbul’da kalsınlar.", "Reply": "Hududda Moskof var, bunu bilirsin… Peki, yarısı kalsın.", "IsAlternate": true, "Unlocks": "C08_Alemdar.amnesty", "Effects": [{"Stat": "Supply", "Value": -8}, {"Stat": "Stability", "Value": 6}, {"Stat": "ConflictChance", "Value": -20}]}, {"Id": "C", "Text": "Yeniçeri kışlalarını önceden kuşatalım.", "Reply": "Ben de bunu derim! Yılanın başı küçükken ezilir.", "IsAlternate": true, "Unlocks": "C08_Alemdar.purge", "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "Stability", "Value": -15}, {"Stat": "Manpower", "Value": -500}]}], "HistoricalNote": "Kasım 1808’de Babıâli’de kuşatılınca cephaneliğin infilakıyla öldü; patlamayı kendisinin ateşlediği anlatılır."}, {"Name": "NPC10_MahmudII", "FullName": "Sultan II. Mahmud", "Title": "Padişah", "Era": "Era2", "Chapters": ["C09_VakaiHayriye"], "ActiveFrom": 1826, "ActiveTo": 1839, "InteractKey": "F", "Location": "Beyazıt – Serasker Kapısı avlusu, yangın kulesinin gölgesi; Rami Kışlası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "1826: sarık ve sorguç. 1829 sonrası: püsküllü fes, elmas sorguç", "Clothing": "1826: kürklü kaftan. 1829 sonrası: koyu lacivert setre, pantolon, pelerin (harmani), kılıç", "FacialHair": "Kısa kesilmiş siyah sakal", "Props": ["Sancak-ı Şerif (1826 sahnesi)", "Mansûre kanunnamesi", "Islahat haritası"], "Forbidden": ["1826 sahnesinde fes", "Geç dönem (Abdülhamid tipi) nişan dizisi"], "ArtRefNote": "İki model varyantı şart: kıyafet inkılâbı öncesi ve sonrası portreleri (Topkapı ve Dolmabahçe koleksiyonları)."}, "Personality": "Sabırlı, kararlı, sert; on sekiz yıl bekleyip tek hamlede vuran.", "Greeting": "Yaklaş. Bugünü on sekiz yıl bekledim; bir gün daha beklemeye tahammülüm yoktur.", "Prompt": "Ocağın ilgasıyla meydan boş kalmamalı; nizamı, maaşı ve talimi olan yeni asker derhal teşkil olunmalıdır. Devletin emri her vilayette aynı açıklıkla işitilsin.", "Choices": [{"Id": "A", "Text": "Asâkir-i Mansûre taburlarını ve kışlalarını hemen kuralım.", "Reply": "Serasker’e söyle: yarın sabah ilk yoklamayı ben alacağım.", "IsAlternate": false, "Unlocks": "C09_VakaiHayriye.institutional", "Effects": [{"Stat": "PP", "Value": -35}, {"Stat": "Treasury", "Value": -30}, {"Stat": "Manpower", "Value": 1400}, {"Stat": "Organization", "Value": 8}]}, {"Id": "B", "Text": "Önce maaş ve iaşe defterini düzeltelim; ulûfe esamesi satılmasın.", "Reply": "Doğrudur. Ocağı batıran kılıç değil, esame kâğıdıdır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -20}, {"Stat": "Stability", "Value": 7}, {"Stat": "DelayDays", "Value": 45}]}, {"Id": "C", "Text": "Mektep açalım: zabiti olmayan ordu, başsız gövdedir.", "Reply": "Tıbhâne ile başla, Harbiye ardından gelsin. Frenk’ten muallim getirt; ama dizgini elden bırakma.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -25}, {"Stat": "ResearchSpeed", "Value": 6}, {"Stat": "Organization", "Value": 4}]}], "HistoricalNote": "Beyazıt Yangın Kulesi’nin bugünkü kâgir yapısı 1828’de yapıldı; 1826 sahnesinde ahşap kule veya boş avlu modellenmeli."}, {"Name": "NPC11_OmerLutfiPasa", "FullName": "Ömer Lütfi Paşa", "Title": "Serdar-ı Ekrem, Rumeli Ordusu Müşiri", "Era": "Era2", "Chapters": ["C10_ZeytinburnuVeKirim"], "ActiveFrom": 1853, "ActiveTo": 1856, "InteractKey": "T", "Location": "Şumnu karargâhı – telgraf ve menzil kalemi; Tuna kıyısında Kalafat tabyası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Fes (koyu kırmızı, mavi püskül)", "Clothing": "Tanzimat dönemi müşir setresi: lacivert, sırma işlemeli yaka ve kol, kırmızı şeritli pantolon, süvari çizmesi", "FacialHair": "Kır, kısa sakal ve bıyık", "Props": ["Sahra dürbünü", "Tuna haritası", "Telgraf şeritleri", "Mecidî nişanı"], "Forbidden": ["Kalpak", "Sarık"], "ArtRefNote": "Roger Fenton’ın 1855 Kırım fotoğrafları arasında portresi vardır."}, "Personality": "Hırvat asıllı, Avusturya ordusundan gelme; disiplinli, soğuk, usta bir savunma kumandanı.", "Greeting": "Vaktim dardır; siz de kısa konuşun. Rus kısa konuşmaz, top atar.", "Prompt": "Nehir boyundaki her mevziden haber karargâha vaktinde varmalıdır. Telgrafın sözü hızlıdır; fakat teli, direği ve onu koruyacak neferi ihmal ederseniz susar. Müttefik de yardım eder, ama bedelini sorar.", "Choices": [{"Id": "A", "Text": "Şumnu’ya kadar tel çekilsin, hat boyuna muhafız konsun.", "Reply": "Güzel. Bir tel, bir süvari alayından fazla iş görür.", "IsAlternate": false, "Unlocks": "C10_ZeytinburnuVeKirim.line_security", "Effects": [{"Stat": "Supply", "Value": 10}, {"Stat": "PP", "Value": -15}, {"Stat": "Manpower", "Value": -100}]}, {"Id": "B", "Text": "Mühimmatı Silistre ve Kalafat tabyalarına yığalım.", "Reply": "Tabya dayanır. Yeter ki içindeki aç kalmasın.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Eq_Artillery", "Value": 150}, {"Stat": "Treasury", "Value": -25}]}, {"Id": "C", "Text": "İkmali müttefik nakliye gemilerine bağlayalım.", "Reply": "Kolay yol. Kolay yolun faturası savaştan sonra gelir.", "IsAlternate": false, "Unlocks": "C10_ZeytinburnuVeKirim.foreign_purchase", "Effects": [{"Stat": "Supply", "Value": 15}, {"Stat": "PP", "Value": 10}, {"Stat": "ForeignDependence", "Value": 10}]}], "HistoricalNote": "Asıl adı Mihajlo Latas’tır. 1855’te Gözleve’de Rus taarruzunu püskürttü."}, {"Name": "NPC12_HobartPasa", "FullName": "Hobart Paşa (Augustus Charles Hobart-Hampden)", "Title": "Osmanlı Donanması’nda amiral (ferik, sonra müşir)", "Era": "Era3", "Chapters": ["C11_ZirhliDonanma"], "ActiveFrom": 1868, "ActiveTo": 1886, "InteractKey": "G", "Location": "Haliç – Tersane-i Âmire rıhtımı, demirli bir zırhlı firkateynin iskelesi", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Fes", "Clothing": "Osmanlı bahriye amiral setresi: lacivert, çift sıra düğme, sırma kol şeritleri", "FacialHair": "Uzun, çatallı beyaz favori ve sakal (Viktorya tarzı)", "Props": ["Deniz dürbünü", "Gemi jurnali", "Osmanî nişanı"], "Forbidden": ["Britanya Kraliyet Donanması üniforması", "Sarık"], "ArtRefNote": "1870’lerin fotoğrafları ve Vanity Fair karikatürü (1878)."}, "Personality": "Eski abluka kaçakçısı, maceracı, açık sözlü; gemiyi limanda çürütenlere tahammülsüz.", "Greeting": "Efendim! Güzel gemiler, değil mi? Yazık ki bacalarından duman çıkmıyor.", "Prompt": "Zırhlı satın almak kolaydır; onu yürütecek çarkçıyı, nişan alacak topçuyu yetiştirmek yıllar ister. Gemi Haliç’te yattıkça kazanı paslanır, tayfası kayıkçı olur. Ya denize çıkalım, ya da bu kadar gemiyi almayalım.", "Choices": [{"Id": "A", "Text": "Filo her yaz Akdeniz’de talime çıksın.", "Reply": "Kömür yakmadan denizci olunmaz. İlk seyir Suda Koyu’na!", "IsAlternate": false, "Unlocks": "C11_ZirhliDonanma.maintained_fleet", "Effects": [{"Stat": "NavalReadiness", "Value": 15}, {"Stat": "Treasury", "Value": -30}]}, {"Id": "B", "Text": "Çarkçı ve topçu mektebi açalım; yabancı makinistlere muhtaç olmayalım.", "Reply": "Benim gibilere ihtiyacınız kalmasın, öyle mi? Bravo. Doğrusu da bu.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -20}, {"Stat": "NavalReadiness", "Value": 8}, {"Stat": "ForeignDependence", "Value": -8}]}, {"Id": "C", "Text": "Yeni zırhlı siparişi verelim; sayı caydırır.", "Reply": "Sayı gazeteleri caydırır efendim, düşmanı değil.", "IsAlternate": false, "Unlocks": "C11_ZirhliDonanma.big_fleet", "Effects": [{"Stat": "Eq_Naval", "Value": 2}, {"Stat": "Debt", "Value": 25}, {"Stat": "Stability", "Value": -4}]}], "HistoricalNote": "Girit isyanı sırasında (1867–1869) ablukayı yönetti; 93 Harbi’nde Karadeniz filosuna komuta etti."}, {"Name": "NPC13_GaziOsmanPasa", "FullName": "Gazi Osman Nuri Paşa", "Title": "Müşir, Plevne Müdafii", "Era": "Era3", "Chapters": ["C12_PlevneVeAziziye"], "ActiveFrom": 1877, "ActiveTo": 1877, "InteractKey": "R", "Location": "Plevne – tabya gerisindeki toprak örtülü karargâh sığınağı, nefer yoklaması", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Fes", "Clothing": "Lacivert müşir setresi üzerine kalın asker kaputu, çamurlu çizme", "FacialHair": "Gür, dolgun siyah sakal (kırlaşmaya başlamış), bıyık", "Props": ["Yıpranmış harita", "Dürbün", "Kılıç", "Göğüste yalnız bir-iki nişan"], "Forbidden": ["Kalpak", "Savaş sonrası aldığı nişanların tamamı", "Mavzer tüfeği (neferlerde Peabody-Martini/Winchester)"], "ArtRefNote": "1877–78 fotoğrafları ve teslim sahnesini gösteren dönem gravürleri."}, "Personality": "Az konuşur, dindar, neferiyle aynı tayını yer; inatçı ve metin.", "Greeting": "Hoş geldin evlâdım. Çorbadan bir kaşık al, sonra konuşuruz. Neferin yediğini yemeyen, neferin çektiğini bilmez.", "Prompt": "Plevne’nin müdafaası tabyadan ibaret değildir; iaşe, sıhhiye ve neferin sabrı da hattın parçasıdır. Çember kapandı. Elde kırk günlük erzak, sayılı fişek var. Hangi kuvveti muhafaza edeceğiz?", "Choices": [{"Id": "A", "Text": "Tayını azaltıp müdafaaya devam edelim; yardım gelebilir.", "Reply": "Sabır da bir silahtır. Lâkin onun da cephanesi tükenir, unutma.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Organization", "Value": 8}, {"Stat": "Supply", "Value": 5}, {"Stat": "Manpower", "Value": -100}]}, {"Id": "B", "Text": "Kuvvetimiz yerindeyken huruç edip çemberi yaralım.", "Reply": "Yaralıları bırakmak ağır gelir… Ama aç askerle huruç olmaz. Vid köprüsünden, şafakla.", "IsAlternate": false, "Unlocks": "C12_PlevneVeAziziye.historical_breakout", "Effects": [{"Stat": "WarSupport", "Value": 10}, {"Stat": "Encirclement", "Value": -20}, {"Stat": "Manpower", "Value": -900}]}, {"Id": "C", "Text": "Şimendifer hattından ikmal katarı sokalım.", "Reply": "O hat döşenmiş olsaydı bu bahsi hiç açmazdık. Madem var, katarı geceleyin yürütün.", "IsAlternate": true, "Unlocks": "C12_PlevneVeAziziye.rail_supply_whatif", "Effects": [{"Stat": "Supply", "Value": 20}, {"Stat": "PP", "Value": -30}, {"Stat": "SabotageRisk", "Value": 15}]}], "HistoricalNote": "C seçeneği yalnız “Plevne İkmal Hattı” odağı tamamlanmışsa görünür. Teslimde yaralıydı; Çar II. Aleksandr kılıcını iade etti."}, {"Name": "NPC14_GaziAhmedMuhtarPasa", "FullName": "Gazi Ahmed Muhtar Paşa", "Title": "Müşir, Anadolu Ordusu Kumandanı", "Era": "Era3", "Chapters": ["C12_PlevneVeAziziye"], "ActiveFrom": 1877, "ActiveTo": 1878, "InteractKey": "F", "Location": "Erzurum – kale içindeki karargâh, harita masası; Mecidiye tabyası rasat mevkii", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Fes", "Clothing": "Müşir setresi, kürk yakalı kışlık kaput, eldiven", "FacialHair": "Kır sakal ve bıyık", "Props": ["Erzurum tahkimat planı", "Rasat dürbünü ve pusula", "Takvim/astronomi cetvelleri"], "Forbidden": ["Kalpak"], "ArtRefNote": "1877–78 fotoğrafları. Astronomi ve takvim ilmine merakı (ileride “Islâhü’t-takvîm” yazarı) masadaki eşyalarla ima edilebilir."}, "Personality": "Mühendis kafalı, hesapçı, soğukkanlı; riyaziye ve heyet ilmine meraklı.", "Greeting": "Kar yağacak. Barometre düşüyor; Moskof da bunu bilir.", "Prompt": "Erzurum’un kapısı tabyadır; fakat bu kapının ardında ahali ve kışlık iaşe vardır. Deveboynu’ndan yorgun döndük. Mevziyi tutarken şehrin müdafaasını da tertip edelim.", "Choices": [{"Id": "A", "Text": "Aziziye ve Mecidiye tabyalarına cephane ve çift nöbet.", "Reply": "Gece baskınına karşı tek ilaç uyanık nöbetçidir. Emri yazın.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "FortLevel", "Value": 1}, {"Stat": "Eq_Artillery", "Value": -80}]}, {"Id": "B", "Text": "Ahaliyi müdafaaya ortak edelim; kadın, çocuk ve yaralıyı iç mahallelere alalım.", "Reply": "Erzurumlu dadaştır, çağırmadan gelir. Biz ona yol gösterelim yeter.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Stability", "Value": 6}, {"Stat": "WarSupport", "Value": 5}, {"Stat": "Supply", "Value": -5}]}, {"Id": "C", "Text": "İhtiyatları şehir dışında toplayıp karşı taarruza hazırlayalım.", "Reply": "Elimizdeki son ihtiyattır; hesabını iyi yapalım.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Organization", "Value": 7}, {"Stat": "Manpower", "Value": -150}]}], "HistoricalNote": "1912’de sadrazam oldu. Hatıratı “Sergüzeşt-i Hayâtım” bu cephe için birincil kaynaktır."}, {"Name": "NPC15_NeneHatun", "FullName": "Nene Hatun", "Title": "Erzurumlu sivil; Aziziye müdafaasına katılan halkın simgesi", "Era": "Era3", "Chapters": ["C12_PlevneVeAziziye"], "ActiveFrom": 1877, "ActiveTo": 1877, "InteractKey": "R", "Location": "Erzurum – Aziziye tabyası yolu, şafak vakti; halkın toplandığı tabya eteği", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Erzurum ehramı (yün örtü) ve yazma", "Clothing": "Yöresel uzun entari, yün şal kuşak, yemeni/çarık; yirmi yaşlarında genç bir kadın", "FacialHair": "", "Props": ["Satır veya balta (kaynak anlatısına göre)", "Ele geçirilmiş bir tüfek (sahne sonu)"], "Forbidden": ["Askerî üniforma", "Yaşlı kadın modeli (1877’de gençtir)", "Abartılı savaşçı zırhı/kostümü"], "ArtRefNote": "Bilinen fotoğrafları yaşlılık dönemine (1950’ler) aittir; 1877 modeli için Erzurum yöresi 19. yy kadın giyimi etnografik kaynaklardan doğrulanmalı."}, "Personality": "Kararlı, az sözlü; kardeşini yeni kaybetmiş, bebeğini evde bırakıp tabyaya koşan genç bir anne.", "Greeting": "Paşa oğlum, yol ver. Tabyada kardaşım yatıyor.", "Prompt": "Minareden seslendiler, duyan evinden çıktı. Elinde tüfeği olan tüfeğiyle, olmayan baltasıyla geldi. Sen zabitsin; söyle, bu kalabalığı nereye süreceksin?", "Choices": [{"Id": "A", "Text": "Halkı askerin gerisinde tutup tabyaya birlikte hücum edelim.", "Reply": "Geride durmaya gelmedik. Ama sen bilirsin; önde yürü, ardındayız.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "WarSupport", "Value": 10}, {"Stat": "Morale", "Value": 12}, {"Stat": "Manpower", "Value": -120}]}, {"Id": "B", "Text": "Kadınlar ve yaşlılar yaralı taşısın, cephane ve su getirsin.", "Reply": "Su da taşırız, yaralı da. Lâkin kapıya dayanan düşmana sırtımızı dönmeyiz.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Supply", "Value": 6}, {"Stat": "Stability", "Value": 5}, {"Stat": "Morale", "Value": 5}]}, {"Id": "C", "Text": "Siviller geri dönsün; bu iş askerin işidir.", "Reply": "Burası bizim evimiz oğul. Evini bırakıp giden görülmüş mü?", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Stability", "Value": -4}, {"Stat": "WarSupport", "Value": -6}, {"Stat": "CivilianCasualtyRisk", "Value": -15}]}], "HistoricalNote": "1955’te Erzurum’da vefat etti. Hakkındaki anlatıların büyük kısmı geç dönem röportaj ve hatıralara dayanır; diyalog bütünüyle özgündür ve saygılı bir temsil gözetilmelidir."}, {"Name": "NPC16_GoltzPasa", "FullName": "Colmar Freiherr von der Goltz (Goltz Paşa)", "Title": "Alman kurmay subayı; Osmanlı askerî mektepleri müfettişi", "Era": "Era3", "Chapters": ["C13_MavzerVeKrupp"], "ActiveFrom": 1883, "ActiveTo": 1895, "InteractKey": "R", "Location": "Pangaltı – Mekteb-i Harbiye talim avlusu ve harp oyunu salonu", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Fes", "Clothing": "Osmanlı ferik/müşir setresi; Prusyalı duruşu", "FacialHair": "Kır bıyık, kısa sakal", "Props": ["Kalın camlı yuvarlak gözlük (belirleyici özellik)", "Kriegsspiel haritası ve birlik blokları", "“Millet-i Müsellaha” tercümesi"], "Forbidden": ["Pickelhaube (Osmanlı hizmetinde)", "1914–16 dönemi mareşal üniforması bu çağda"], "ArtRefNote": "1880–90’lar İstanbul fotoğrafları. 1915–16’daki ikinci Osmanlı görevi için ayrı, yaşlı varyant gerekir."}, "Personality": "Hoca tabiatlı, sabırlı, öğrencilerine düşkün; teorisyen ve yazar.", "Greeting": "Ah, buyurun. Zabit adaylarım tam da haritada Balkan geçitlerini müdafaa ediyordu. Fena değiller.", "Prompt": "İyi tüfek satın alınır; iyi zabit yetiştirilir. Bana yirmi sene ve çalışkan gençler verin. Bu arada komisyon tüfek meselesini soruyor; Mavzer mekanizması tecrübede hepsinden üstün çıktı. Fakat ne kadar ve nasıl alacağınız sizin kararınızdır.", "Choices": [{"Id": "A", "Text": "Harbiye’de erkân-ı harp sınıflarını genişletelim, tatbikat ve harp oyununu mecburi kılalım.", "Reply": "Mükemmel. Bugünün mülazımı, yirmi sene sonranın ordu kumandanıdır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -20}, {"Stat": "Organization", "Value": 12}, {"Stat": "ResearchSpeed", "Value": 4}]}, {"Id": "B", "Text": "Büyük Mavzer ve Krupp siparişini imzalayalım.", "Reply": "Piyadeniz Avrupa’nın en iyi tüfeğine sahip olacak. Taksitleri aksatmayınız.", "IsAlternate": false, "Unlocks": "C13_MavzerVeKrupp.import_all", "Effects": [{"Stat": "Eq_Infantry", "Value": 300}, {"Stat": "Eq_Artillery", "Value": 60}, {"Stat": "Debt", "Value": 15}, {"Stat": "ForeignDependence", "Value": 10}]}, {"Id": "C", "Text": "Tüfeği alalım, fişeği ve tamiri Tophane’de yapalım.", "Reply": "Fabrikatörler bundan hoşlanmaz. Ben askerim, tüccar değil: akıllıca.", "IsAlternate": true, "Unlocks": "C13_MavzerVeKrupp.import_plus_ammo", "Effects": [{"Stat": "Eq_Infantry", "Value": 200}, {"Stat": "FactoryEfficiency", "Value": 8}, {"Stat": "Treasury", "Value": -35}]}], "HistoricalNote": "1915’te Osmanlı ordusuna döndü; Nisan 1916’da Bağdat’ta tifüsten öldü, Tarabya’ya defnedildi."}, {"Name": "NPC17_WilhelmVonPressel", "FullName": "Wilhelm von Pressel", "Title": "Avusturyalı demiryolu mühendisi; Osmanlı demiryolları umum müdürü/müşaviri", "Era": "Era3", "Chapters": ["C14_Demiryollari"], "ActiveFrom": 1869, "ActiveTo": 1900, "InteractKey": "T", "Location": "Sirkeci – istasyon plan odası, çizim masası", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Başı açık; dışarıda melon şapka", "Clothing": "Koyu redingot, yelek, köstekli saat", "FacialHair": "Uzun beyaz sakal", "Props": ["Plan ruloları", "Teodolit", "Eğim cetveli", "Anadolu haritası üzerinde kırmızı kalemle çizilmiş hat"], "Forbidden": ["Osmanlı paşa üniforması", "Fes (resmî görevli değil, mühendis kimliğiyle)"], "ArtRefNote": "Geç dönem fotoğraf portresi mevcuttur."}, "Personality": "İdealist, kırgın; hattın yabancı sermayeye değil Osmanlı devletine ait olmasını savunan mühendis.", "Greeting": "Buyurun. Ayağınızın altındaki ruloya basmayın lütfen; o Bağdat’a kadar gidiyor.", "Prompt": "Ray, ancak köprü, su deposu, bakım atölyesi ve işletme nizamı tamam olursa asker taşır. Kilometre garantisi verilen şirket hattı uzatmak için kıvırır, devlet öder. Güzergâhı çizmek kolay; onu bütün yıl işler tutmak asıl hesaptır.", "Choices": [{"Id": "A", "Text": "Kritik köprülere ve bakım atölyelerine yatırım yapalım.", "Reply": "Sonunda rayın altına bakan biri! Atölyesi olmayan hat on senede hurdadır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Treasury", "Value": -35}, {"Stat": "Supply", "Value": 12}, {"Stat": "FactoryEfficiency", "Value": 4}]}, {"Id": "B", "Text": "Hattı şirket eliyle hızla uzatalım; garantiyi verelim.", "Reply": "Hızlı olur. Dümdüz ovada kıvrıla kıvrıla giden bir hat olur. Siz bilirsiniz.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Supply", "Value": 8}, {"Stat": "Debt", "Value": 12}, {"Stat": "SabotageRisk", "Value": 10}]}, {"Id": "C", "Text": "Devlet eliyle, dar hatla ve ucuza yapalım.", "Reply": "Yıllardı ity": "Centilmen, İngilizce bilen, tayfasınca sevilen; cüretkâr ama hesaplı.", "Greeting": "Hoş geldiniz. Güverte kömür tozu içindedir, kusura bakmayın; az evvel ikmali bitirdik.", "Prompt": "Hamidiye’nin sürati bize teşebbüs verir; lâkin kömür ve makine bakımı olmadan denizde kalamayız. Bir gemiyle donanma yenilmez, ama düşmanın uykusu kaçırılır. Hedefi seçelim; her akın dönüş yolunun hesabıyla başlar.", "Choices": [{"Id": "A", "Text": "Düşman nakliye ve ticaret gemilerine akın.", "Reply": "Âlâ. Gece çıkıyoruz; fenerler sönük, telsiz kapalı.", "IsAlternate": false, "Unlocks": "C18_CatalcaVeEdirne.hamidiye_raids", "Effects": [{"Stat": "ConvoyDisruption", "Value": 12}, {"Stat": "NavalReadiness", "Value": -8}, {"Stat": "WarSupport", "Value": 4}]}, {"Id": "B", "Text": "Önce kömür ve kazan bakımı; tarafsız limanlarda ikmal ayarlayalım.", "Reply": "Sabırlı kaptan, gemisini eve getirir.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "NavalReadiness", "Value": 10}, {"Stat": "WarSupport", "Value": -2}]}, {"Id": "C", "Text": "Arnavutluk kıyısındaki düşman çıkarma iskelelerini topa tutalım.", "Reply": "Riskli; ama Rumeli’de kalan askerimiz bayrağımızı görsün.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "NavalReadiness", "Value": -12}, {"Stat": "Morale", "Value": 6}]}], "HistoricalNote": "1918’de Bahriye Nazırı olarak Mondros Mütarekesi’ni imzaladı; 1922–1923’te başvekillik yaptı. Bu görevlerdeki modeli ayrı varyanttır."}, {"Name": "NPC22_CevatPasa", "FullName": "Cevat Paşa (Çobanlı)", "Title": "Çanakkale Müstahkem Mevki Kumandanı", "Era": "Era4", "Chapters": ["C19_Canakkale"], "ActiveFrom": 1914, "ActiveTo": 1915, "InteractKey": "R", "Location": "Kilitbahir – Rumeli Mecidiye tabyası gerisi, batarya denetimi; Çanakkale karargâhı", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Kalpak (1909 sonrası subay başlığı) veya kabalak", "Clothing": "Haki sahra üniforması, kırmızı yakalıklı general işareti, çizme,
