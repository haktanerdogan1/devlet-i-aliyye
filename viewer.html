: "Supply", "Value": 8}, {"Stat": "Manpower", "Value": -180}]}, {"Id": "C", "Text": "Sivil ahaliyi ve hastaları trenle Şam’a sevk edelim.", "Reply": "Evvelce bir kısmını yolladık. Kalanlar için de koridor aç; asker kalır.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Stability", "Value": 8}, {"Stat": "Supply", "Value": 6}, {"Stat": "Manpower", "Value": -50}]}], "HistoricalNote": "Medine’deki kutsal emanetleri 1917’de İstanbul’a gönderdi. Ocak 1919’da kendi subaylarınca ikna edilerek teslim oldu; Malta’ya sürüldü."}, {"Name": "NPC25_NuriPasa", "FullName": "Nuri Paşa (Nuri Killigil)", "Title": "Kafkas İslâm Ordusu Kumandanı (Fahri Ferik)", "Era": "Era4", "Chapters": ["C20_UzakCepheler"], "ActiveFrom": 1918, "ActiveTo": 1918, "InteractKey": "R", "Location": "Gence karargâhı; Bakü’yü gören sırtlar", "IsHistoricalPerson": true, "Appearance": {"Headwear": "Kalpak", "Clothing": "Haki sahra üniforması, general yakalığı; yirmi dokuz yaşında, çok genç", "FacialHair": "İnce bıyık", "Props": ["Bakü petrol sahaları haritası", "Dürbün"], "Forbidden": ["Sivil fabrikatör kıyafeti (o kimliği 1930’lara aittir)", "İmalat-ı Harbiye sahnelerinde kullanım"], "ArtRefNote": "1918 Gence ve Bakü fotoğrafları."}, "Personality": "Enver Paşa’nın kardeşi; hırslı, enerjik, siyasi hedefleri askerî imkânın önüne koymaya meyilli.", "Greeting": "Tam vaktinde geldin. Şimendifer Gence’ye kadar bizim; ötesi tüfekle açılacak.", "Prompt": "Elimde bir fırka ile yerli gönüllüler var; Bakü’de İngiliz ve mevzilenmiş kuvvetler. Filistin cephesi ise yardım diye inliyor. İstanbul bir şey söyler, Almanlar başka. Yürüyelim mi?", "Choices": [{"Id": "A", "Text": "Bakü’ye yürüyelim; fakat şehre girişte sivil ahalinin emniyeti için sıkı nizam koyalım.", "Reply": "Nizam… Evet. İnzibat müfrezesini sen tertip et.", "IsAlternate": true, "Unlocks": "", "Effects": [{"Stat": "WarSupport", "Value": 8}, {"Stat": "Manpower", "Value": -300}, {"Stat": "Supply", "Value": -10}, {"Stat": "CivilianCasualtyRisk", "Value": -20}]}, {"Id": "B", "Text": "Bu fırkayı Filistin cephesine sevk edelim.", "Reply": "Ağabeyim bunu duymak istemez. Sen de bunu bana söylemedin.", "IsAlternate": true, "Unlocks": "", "Effects": [{"Stat": "PP", "Value": -30}, {"Stat": "Organization", "Value": 6}, {"Stat": "Supply", "Value": 8}]}, {"Id": "C", "Text": "Gence–Batum demiryolunu ve petrol sevkini emniyete alıp bekleyelim.", "Reply": "Beklemek… Mütareke gelirse hepsi boşa gider. Ama hat lâzım, doğru.", "IsAlternate": false, "Unlocks": "", "Effects": [{"Stat": "Supply", "Value": 12}, {"Stat": "FactoryEfficiency", "Value": 3}, {"Stat": "WarSupport", "Value": -3}]}], "HistoricalNote": "Bakü 15 Eylül 1918’de alındı; şehrin el değiştirdiği 1918 yılında Mart ve Eylül aylarında Müslüman ve Ermeni sivillere yönelik katliamlar yaşandı. Bu bağlam oyunda yok sayılmamalı; A seçeneği bu nedenle bir sorumluluk kararıdır. Nuri Killigil’in silah fabrikası (Zeytinburnu/Sütlüce) 1930’lara aittir ve bu oyunun zaman aralığının dışındadır."}, {"Name": "NPC26_ImalatiHarbiyeUstabasi", "FullName": "İmalat-ı Harbiye Ustabaşısı (adı verilmeyen temsilî karakter)", "Title": "Tophane tüfek tamirhanesi ustabaşısı", "Era": "Era4", "Chapters": ["C21_ImalatiHarbiye"], "ActiveFrom": 1919, "ActiveTo": 1922, "InteractKey": "E", "Location": "İşgal altındaki İstanbul – Tophane arka sokağı, gece; atölyenin kömürlük kapısı", "IsHistoricalPerson": false, "Appearance": {"Headwear": "Yıpranmış fes; dışarıda kasket değil, kalıpsız fes veya kalpak", "Clothing": "Yağlı iş önlüğü, yelek, kolları sıvalı mintan; ceketinin altında gizli bir Mavzer sürgüsü", "FacialHair": "Kır bıyık, birkaç günlük sakal", "Props": ["Gaz lambası", "Tüfek mekanizma parçaları sarılı bez bohça", "Sahte irsaliye", "Mengene ve eğe"], "Forbidden": ["Üniforma", "Gerçek bir kişinin adı veya yüzü"], "ArtRefNote": "Gerçek bir şahıs DEĞİLDİR; Milli Mücadele’de silah kaçıran askerî fabrika ustalarını temsil eden kompozit karakterdir. Belgelenmiş bir isim bulunursa (ATASE/MKE kaynakları) bu kayıt onunla değiştirilmelidir."}, "Personality": "Sessiz, usta, korkusunu espriyle bastıran bir İstanbul zanaatkârı.", "Greeting": "Şşt! Kapıyı ört beyim. Devriye on dakikada bir geçiyor.", "Prompt": "Depoda kamaları sökülmüş elli top, üç yüz sandık fişek var. Kamalar bende; nerede olduğunu Azrail’e bile söylemem. Tezgâhları da söküp götürebiliriz, ama sayımda eksik çıkarsa hepimizi asarlar. Mavna Sirkeci’de bekliyor. Ne yüklüyoruz?", "Choices": [{"Id": "A", "Text": "Top kamaları ve fişek: cephe bugün bunu bekliyor.", "Reply": "Kamaları kömür çuvalına koyarım. İnebolu’da kayıkçılara “kömür ağır” deyin, anlarlar.", "IsAlternate": false, "Unlocks": "C21_ImalatiHarbiye.covert_shipments", "Effects": [{"Stat": "Eq_Artillery", "Value": 50}, {"Stat": "Eq_Infantry", "Value": 220}, {"Stat": "DiscoveryRisk", "Value": 15}]}, {"Id": "B", "Text": "Tezgâhları ve kalıpları parça parça kaçıralım; Ankara kendi fişeğini yapsın.", "Reply": "Uzun iş, tehlikeli iş. Ama balık vermek değil, olta götürmek bu. Varım.", "IsAlternate": false, "Unlocks": "C21_ImalatiHarbiye.anatolian_workshops", "Effects": [{"Stat": "FactoryEfficiency", "Value": 10}, {"Stat": "Eq_Infantry", "Value": 60}, {"Stat": "DiscoveryRisk", "Value": 25}, {"Stat": "DelayDays", "Value": 45}]}, {"Id": "C", "Text": "Önce ustaları ve ailelerini geçirelim; sen de git.", "Reply": "Ben son mavnayla gelirim beyim. Bu dükkânın anahtarı bende; kapıyı kapatan da ben olacağım.", "IsAlternate": false, "Unlocks": "C21_ImalatiHarbiye.evacuate_workers", "Effects": [{"Stat": "Manpower", "Value": 80}, {"Stat": "Output", "Value": -5}, {"Stat": "DiscoveryRisk", "Value": -10}]}], "HistoricalNote": "Top kamalarının sökülüp saklanması ve sonradan Anadolu’ya kaçırılması Milli Mücadele hatıratında sıkça geçen gerçek bir uygulamadır; buradaki rakamlar oyun değeridir."}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent);
const ERA={Era1:['I. Çağ — Barut ve İmparatorluk','1700–1789'],Era2:['II. Çağ — Nizam ve Sanayileşme','1789–1860'],Era3:['III. Çağ — Demiryolu, Krupp ve Zırhlılar','1860–1908'],Era4:['IV. Çağ — Cihan Harbi ve İstiklal','1908–1925']};
const STAT={PP:'Politik Güç',Stability:'İstikrar',WarSupport:'Savaş Desteği',Manpower:'İnsan Gücü',Treasury:'Hazine',Debt:'Borç',FactoryEfficiency:'Fabrika Verimi',Organization:'Organizasyon',Morale:'Moral',Supply:'İkmal',Output:'Üretim',FortLevel:'Tahkimat',NavalReadiness:'Donanma Hazırlığı',ResearchSpeed:'Araştırma Hızı',MilitaryCapacity:'Askerî Kapasite',Eq_Infantry:'Tüfek',Eq_Artillery:'Top',Eq_Naval:'Gemi',ForeignPressure:'Dış Baskı',ForeignDependence:'Dışa Bağımlılık',DiscoveryRisk:'Yakalanma Riski',SabotageRisk:'Sabotaj Riski',CivilianCasualtyRisk:'Sivil Kayıp Riski',BreakoutChance:'Yarma İhtimali',ConflictChance:'Çatışma İhtimali',Encirclement:'Kuşatılmışlık',ConvoyDisruption:'Konvoy Baskını',DelayDays:'Gecikme (gün)'};
const LAYER={HOI4:'Harita',AOE:'Şehir/Savaş',TPS:'Sokak'};
const KEYN={E:'Fabrika',F:'Nezaret',R:'Kışla',T:'Gar',G:'Donanma'};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx=a=>'<div class="fx">'+a.map(x=>`<span>${x.Value>0?'+':'−'}${Math.abs(x.Value)} ${e(STAT[x.Stat]||x.Stat)}</span>`).join('')+'</div>';
const badge=alt=>alt?'<span class="tag alt">Alternatif</span>':'<span class="tag hist">Tarihsel</span>';
const yrs=(a,b)=>a===b?a:`${a}–${b}`;
const npName=Object.fromEntries(D.np.map(p=>[p.Name,p.FullName]));
const chName=Object.fromEntries(D.ch.map(c=>[c.Name,c.Title]));
let tab='gorevler',era='';
function chapter(c){
  return `<details id="${c.Name}"><summary><span class="yr">${yrs(c.StartYear,c.EndYear)}</span><span class="ttl">${e(c.Title)}<span>${e(c.Locations.slice(0,3).join(' · '))}</span></span><span></span></summary><div class="body">
  <div><p class="lbl">Tarihsel çerçeve</p><p>${e(c.HistoricalContext)}</p></div>
  <div><p class="lbl">Oyuncunun rolü</p><p>${e(c.PlayerRole)}</p></div>
  <div><p class="lbl">Görev akışı</p><ol>${c.Steps.map(s=>`<li><span class="tag">${LAYER[s.Layer]}</span>${e(s.Text)}</li>`).join('')}</ol></div>
  <div><p class="lbl">Hedefler</p><ul>${c.PrimaryObjectives.map(o=>`<li>${e(o)}</li>`).join('')}</ul></div>
  <div><p class="lbl">Gerçekte ne oldu</p><p>${e(c.HistoricalOutcome)}</p></div>
  <div><p class="lbl">Ya şöyle olsaydı</p><p>${e(c.WhatIf)}</p></div>
  <div><p class="lbl">Olaylar</p><ul>${c.Events.map(v=>`<li>${e(v.Text)} <span class="note">(${e(v.Trigger)})</span></li>`).join('')}</ul></div>
  <div><p class="lbl">Sonuçlar</p><div class="opts">${c.Outcomes.map(o=>`<div class="opt"><div>${badge(!o.IsHistorical)}<b>${e(o.Label)}</b></div>${fx(o.Effects)}</div>`).join('')}</div></div>
  ${c.NPCs.length?`<div><p class="lbl">Karakterler</p><p>${c.NPCs.map(n=>`<a href="#karakterler" data-go="${n}">${e(npName[n])}</a>`).join(' · ')}</p></div>`:''}
  ${c.AccuracyNotes.length?`<div class="warn"><p class="lbl">Doğrulama notları</p><ul>${c.AccuracyNotes.map(n=>`<li>${e(n)}</li>`).join('')}</ul></div>`:''}
  <div><p class="lbl">Kaynaklar</p><ul class="note">${c.Sources.map(s=>`<li>${s.Url?`<a href="${e(s.Url)}">${e(s.Title)}</a>`:e(s.Title)+' — adres teyit edilecek'}</li>`).join('')}</ul></div>
  </div></details>`;
}
function npc(p){
  const a=p.Appearance;
  return `<details id="${p.Name}"><summary><span class="yr">${yrs(p.ActiveFrom,p.ActiveTo)}</span><span class="ttl">${e(p.FullName)}<span>${e(p.Title)}</span></span><span class="key" title="${KEYN[p.InteractKey]}">[${p.InteractKey}] ${KEYN[p.InteractKey]}</span></summary><div class="body">
  ${p.IsHistoricalPerson?'':'<div class="warn">Gerçek bir şahıs değildir; temsilî karakterdir.</div>'}
  <div><p class="lbl">Konum</p><p>${e(p.Location)}</p></div>
  <p class="speech">“${e(p.Greeting)}”</p><p class="speech">${e(p.Prompt)}</p>
  <div><p class="lbl">Oyuncunun seçenekleri</p><div class="opts">${p.Choices.map(c=>`<div class="opt"><div>${c.IsAlternate?badge(true):''}<b>${e(c.Text)}</b></div><div class="reply">“${e(c.Reply)}”</div>${fx(c.Effects)}</div>`).join('')}</div></div>
  <div><p class="lbl">3D model tarifi</p><dl><dt>Başlık</dt><dd>${e(a.Headwear)}</dd><dt>Kıyafet</dt><dd>${e(a.Clothing)}</dd>${a.FacialHair?`<dt>Sakal/bıyık</dt><dd>${e(a.FacialHair)}</dd>`:''}<dt>Eşyalar</dt><dd>${e(a.Props.join(', '))}</dd><dt>Kullanma</dt><dd>${e(a.Forbidden.join(', '))}</dd><dt>Görsel kaynak</dt><dd>${e(a.ArtRefNote)}</dd></dl></div>
  <div><p class="lbl">Kişilik</p><p>${e(p.Personality)}</p></div>
  <div><p class="lbl">Tarih notu</p><p class="note">${e(p.HistoricalNote)}</p></div>
  <p class="note">Görev: ${p.Chapters.map(n=>`<a href="#gorevler" data-go="${n}">${e(chName[n])}</a>`).join(' · ')}</p>
  </div></details>`;
}
function render(open){
  const items=tab==='gorevler'?D.ch:D.np, f=tab==='gorevler'?chapter:npc;
  let h='';
  for(const k of Object.keys(ERA)){ if(era&&era!==k)continue;
    const g=items.filter(x=>x.Era===k); if(!g.length)continue;
    h+=`<h2 class="era-h">${ERA[k][0]}<small>${ERA[k][1]}</small></h2><div class="list">${g.map(f).join('')}</div>`; }
  document.getElementById('out').innerHTML=h;
  for(const t of ['gorevler','karakterler'])document.getElementById('tab-'+t).setAttribute('aria-pressed',t===tab);
  document.querySelectorAll('#eras button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.era===era));
  if(open){const el=document.getElementById(open); if(el){el.open=true; el.scrollIntoView({block:'start'});}}
}
document.getElementById('sub').textContent=`${D.ch.length} kampanya görevi ve ${D.np.length} şehir içi karakter. Bir satıra dokununca ayrıntısı açılır.`;
document.getElementById('eras').innerHTML=[['','Tüm çağlar'],...Object.keys(ERA).map(k=>[k,ERA[k][0].split(' — ')[0]])].map(([k,l])=>`<button data-era="${k}">${l}</button>`).join('');
document.getElementById('eras').addEventListener('click',ev=>{const b=ev.target.closest('button'); if(b){era=b.dataset.era; render();}});
for(const t of ['gorevler','karakterler'])document.getElementById('tab-'+t).addEventListener('click',()=>{location.hash=t; tab=t; render();});
document.getElementById('out').addEventListener('click',ev=>{const a=ev.target.closest('a[data-go]'); if(a){ev.preventDefault(); tab=a.getAttribute('href').slice(1); era=''; location.hash=tab; render(a.dataset.go);}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1); if((h==='gorevler'||h==='karakterler')&&h!==tab){tab=h; render();}});
if(location.hash==='#karakterler')tab='karakterler';
render();
</script>
